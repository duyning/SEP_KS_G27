spring.application.name=HL-RCS
spring.config.import=optional:file:./config/mysql-local.properties,optional:file:./config/sms-local.properties,optional:file:./config/ai-local.properties,optional:file:./config/vietmap-local.properties
spring.profiles.default=mysql
server.port=8080
app.phone-otp.provider=${PHONE_OTP_PROVIDER:esms}
app.phone-otp.esms.api-key=${ESMS_API_KEY:}
app.phone-otp.esms.secret-key=${ESMS_SECRET_KEY:}
app.phone-otp.esms.brandname=${ESMS_BRANDNAME:}
app.phone-otp.esms.template=${ESMS_OTP_TEMPLATE:Ma xac nhan cua ban la {code}}
app.phone-otp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.phone-otp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.phone-otp.twilio.service-sid=${TWILIO_VERIFY_SERVICE_SID:}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=85MB
app.frontend-url=http://localhost:5173
app.google.mobile-browser-origin=${GOOGLE_MOBILE_BROWSER_ORIGIN:}

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hlrcs?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Automatically assign property verification applications; retry waiting applications every minute.
app.verification.auto-assignment.enabled=${AUTO_VERIFICATION_ASSIGNMENT_ENABLED:false}
app.verification.assignment-required=${VERIFICATION_ASSIGNMENT_REQUIRED:false}
app.verification.auto-assignment.initial-delay-ms=30000
app.verification.auto-assignment.retry-delay-ms=60000

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Google Authentication
app.google.client-id=1094293729879-chv3qjptfp4sh6gjg547g07mavqm9v9e.apps.googleusercontent.com

# Reverse geocoding is opt-in. Local use: see docs/property-location-lookup.md.
app.maps.reverse-url=${MAP_REVERSE_URL:}
app.maps.nearby-url=${MAP_NEARBY_URL:https://overpass-api.de/api/interpreter}
app.maps.provider=${MAP_LOCATION_PROVIDER:nominatim}
app.maps.user-agent=${MAP_USER_AGENT:NestHub/1.0 (property location lookup)}

# Community AI moderation: OFF, ASSIST (advisory only), or AUTO.
community.ai.mode=${COMMUNITY_AI_MODE:OFF}
community.ai.key=${GEMINI_API_KEY:}
community.ai.model=${COMMUNITY_AI_MODEL:gemini-3.1-flash-lite}
property.description.ai.key=${PROPERTY_DESCRIPTION_AI_KEY:${community.ai.key:}}
property.description.ai.model=${PROPERTY_DESCRIPTION_AI_MODEL:${community.ai.model:gemini-3.1-flash-lite}}
rental.contract.scan.key=${RENTAL_CONTRACT_SCAN_KEY:${property.description.ai.key:}}
rental.contract.scan.model=${RENTAL_CONTRACT_SCAN_MODEL:${property.description.ai.model:gemini-3.1-flash-lite}}

# VIETMAP Services key stays on the backend.
app.maps.vietmap.enabled=${VIETMAP_ENABLED:false}
app.maps.vietmap.api-key=${VIETMAP_API_KEY:}
app.maps.vietmap.requests-per-minute=${VIETMAP_REQUESTS_PER_MINUTE:120}
