spring.application.name=HL-RCS
spring.config.import=optional:file:./config/mysql-local.properties
spring.profiles.default=mysql
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=85MB
app.frontend-url=http://localhost:5173

spring.datasource.url=jdbc:mysql://localhost:3306/hlrcs?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Automatically assign property verification applications; retry waiting applications every minute.
app.verification.auto-assignment.enabled=${AUTO_VERIFICATION_ASSIGNMENT_ENABLED:false}
app.verification.assignment-required=${VERIFICATION_ASSIGNMENT_REQUIRED:false}
app.verification.auto-assignment.initial-delay-ms=30000
app.verification.auto-assignment.retry-delay-ms=60000

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Reverse geocoding is opt-in. Local use: see docs/property-location-lookup.md.
app.maps.reverse-url=${MAP_REVERSE_URL:}
app.maps.nearby-url=${MAP_NEARBY_URL:https://overpass-api.de/api/interpreter}
app.maps.provider=${MAP_LOCATION_PROVIDER:nominatim}
app.maps.user-agent=${MAP_USER_AGENT:NestHub/1.0 (property location lookup)}
