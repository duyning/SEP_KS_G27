10h320M810 462h320" stroke="#475569"/><text x="819" y="430" font-size="13">- userRepository: UserRepository</text><text x="819" y="481" font-size="13">+ login(…)</text><rect x="30" y="585" width="320" height="155" fill="#ffffff" stroke="#475569"/><text x="190" y="603" text-anchor="middle" font-size="12">«DTO»</text><text x="190" y="625" text-anchor="middle" font-size="15" font-weight="700">AuthResponse</text><path d="M30 635h320M30 687h320" stroke="#475569"/><text x="39" y="655" font-size="13">- accessToken: String</text><text x="39" y="674" font-size="13">- tokenType: String</text><rect x="420" y="585" width="320" height="155" fill="#ffffff" stroke="#475569"/><text x="580" y="603" text-anchor="middle" font-size="12">«service»</text><text x="580" y="625" text-anchor="middle" font-size="15" font-weight="700">JwtTokenProvider</text><path d="M420 635h320M420 687h320" stroke="#475569"/><text x="429" y="655" font-size="13">- jwtSecret: String</text><text x="429" y="674" font-size="13">- jwtExpirationInMs: long</text><text x="429" y="706" font-size="13">+ generateToken(…)</text><rect x="810" y="585" width="320" height="155" fill="#ffffff" stroke="#475569"/><text x="970" y="603" text-anchor="middle" font-size="12">«Spring interface»</text><text x="970" y="625" text-anchor="middle" font-size="15" font-weight="700">AuthenticationManager</text><path d="M810 635h320M810 687h320" stroke="#475569"/><text x="819" y="706" font-size="13">+ authenticate(…)</text></g></svg>