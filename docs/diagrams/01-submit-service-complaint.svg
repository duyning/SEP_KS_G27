<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060"><defs><marker id="arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#374151"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M85 185 V985" stroke="#889199" stroke-dasharray="5 5"/><circle cx="85" cy="112" r="8" fill="white" stroke="#69757c"/><path d="M85 120 v22 m-16 -14 h32 m-16 14 l-14 18 m14 -18 l14 18" fill="none" stroke="#69757c"/><text x="85" y="181" font-family="Arial" font-size="12" text-anchor="middle" fill="#17212b"><tspan x="85" dy="0">USER</tspan></text><path d="M320 185 V985" stroke="#889199" stroke-dasharray="5 5"/><rect x="188" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="320" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="320" dy="0">ServiceReportForm</tspan><tspan x="320" dy="17">«UI»</tspan></text><rect x="316" y="210" width="8" height="765" fill="#b7e4ed" stroke="#64858c"/><path d="M610 185 V985" stroke="#889199" stroke-dasharray="5 5"/><rect x="478" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="610" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="610" dy="0">ServiceComplaintController</tspan><tspan x="610" dy="17">«Controller»</tspan></text><rect x="606" y="210" width="8" height="765" fill="#b7e4ed" stroke="#64858c"/><path d="M900 185 V985" stroke="#889199" stroke-dasharray="5 5"/><rect x="768" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="900" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="900" dy="0">ServiceComplaintService</tspan><tspan x="900" dy="17">«Service»</tspan></text><rect x="896" y="210" width="8" height="765" fill="#b7e4ed" stroke="#64858c"/><path d="M1200 185 V985" stroke="#889199" stroke-dasharray="5 5"/><rect x="1068" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="1200" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1200" dy="0">Service / Complaint</tspan><tspan x="1200" dy="17">«Entity»</tspan></text><rect x="1196" y="210" width="8" height="765" fill="#b7e4ed" stroke="#64858c"/><text x="30" y="51" font-family="Arial" font-size="28" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Submit Service Complaint</tspan></text><text x="30" y="84" font-family="Arial" font-size="16" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Sequence Diagram — Submit Service Complaint</tspan></text><line x1="85" y1="242" x2="320" y2="242" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="232" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">1: openReportForm(serviceId)</tspan></text><line x1="320" y1="294" x2="85" y2="294" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="202.5" y="284" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">2: display form</tspan></text><line x1="85" y1="346" x2="320" y2="346" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="336" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">3: enter content; attach images</tspan></text><line x1="85" y1="398" x2="320" y2="398" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="388" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">4: submitReport()</tspan></text><line x1="320" y1="450" x2="610" y2="450" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="423" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">5: submit(serviceId,</tspan><tspan x="465" dy="17">content, images)</tspan></text><line x1="610" y1="502" x2="900" y2="502" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="475" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">6: submit(serviceId,</tspan><tspan x="755" dy="17">content, images)</tspan></text><line x1="900" y1="554" x2="1200" y2="554" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="544" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">7: load service; lock provider</tspan></text><line x1="1200" y1="606" x2="900" y2="606" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="1050" y="596" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">8: return current service</tspan></text><path d="M900 646 h85 v24 h-85" fill="none" stroke="#374151" marker-end="url(#arrow)"/><text x="995" y="644" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="995" dy="0">9: validate eligibility, content</tspan><tspan x="995" dy="17">and duplicate report</tspan></text><line x1="900" y1="722" x2="1200" y2="722" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="695" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">10: save complaint(PENDING)</tspan><tspan x="1050" dy="17">and evidence</tspan></text><line x1="1200" y1="774" x2="900" y2="774" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="1050" y="764" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">11: return saved complaint</tspan></text><line x1="900" y1="826" x2="610" y2="826" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="755" y="816" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">12: return Detail</tspan></text><line x1="610" y1="878" x2="320" y2="878" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="465" y="868" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">13: 201 Created + Detail</tspan></text><line x1="320" y1="930" x2="85" y2="930" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="202.5" y="920" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">14: display receipt and tracking link</tspan></text><text x="30" y="1030" font-family="Arial" font-size="13" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Requires authentication, a public service and valid content/images. One open report per user and service.</tspan></text></svg>