6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; no self-review]</tspan></text><text x="784.5" y="693.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[accessible post]</tspan></text><text x="784.5" y="785.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; impartial]</tspan></text><text x="784.5" y="844.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; more info needed]</tspan></text><text x="784.5" y="936.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; impartial]</tspan></text><text x="784.5" y="995.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[no outstanding request]</tspan></text><text x="784.5" y="1087.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[worker configured]</tspan></text><text x="784.5" y="1146.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[selection valid]</tspan></text><text x="1450" y="1192.5" text-anchor="middle" font-family="Arial" font-size="15" fill="#254334" font-weight="bold"><tspan x="1450" dy="0">«Supporting Actor»</tspan><tspan x="1450" dy="18">Collection worker</tspan></text><text x="35" y="1348.7" text-anchor="start" font-family="Arial" font-size="13" fill="#254334" ><tspan x="35" dy="0">Dashed arrows: optional actions extend inspection at the stated condition. Solid lines: actor participation, not execution order.</tspan></text><text x="35" y="1377.7" text-anchor="start" font-family="Arial" font-size="13" fill="#254334" ><tspan x="35" dy="0">Property decisions follow assignment policy and version checks. Staff cannot manage accounts, resolve community reports or change AI settings.</tspan></text><text x="35" y="1406.8" text-anchor="start" font-family="Arial" font-size="12" fill="#254334" ><tspan x="35" dy="0">Scope: role-specific operations plus shared account access. Prototype assistance and accommodation-review moderation are excluded. Source: 25 November 2026.</tspan></text></svg>