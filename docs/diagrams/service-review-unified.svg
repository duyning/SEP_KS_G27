<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="2900" viewBox="0 0 1490 2900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#455A64"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="26" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="745" y="45">HL-RCS — Service Application Review</tspan></text><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="745" y="85">Manual review of a new service registration (CREATE)</tspan></text><rect x="24" y="110" width="1442" height="100" fill="#F4F9FB" stroke="#CBD5E1"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="44" y="142">API base: /api/staff/service-applications/{id}</tspan><tspan x="44" y="166">Approve / Reject: POST /review  •  Supplement: POST /supplement-request</tspan><tspan x="44" y="190">Request includes revision; review sends the same decision for capability and listing.</tspan></text><circle cx="80" cy="252" r="10" fill="#83CDE5" stroke="#455A64"/><path d="M 80 262 L 80 295" fill="none" stroke="#455A64" stroke-width="1.3"  /><path d="M 55 274 L 105 274" fill="none" stroke="#455A64" stroke-width="1.3"  /><path d="M 80 295 L 60 320" fill="none" stroke="#455A64" stroke-width="1.3"  /><path d="M 80 295 L 100 320" fill="none" stroke="#455A64" stroke-width="1.3"  /><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="80" y="351">Staff / Admin</tspan></text><rect x="198" y="240" width="204" height="105" fill="#83CDE5" stroke="#455A64"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="300" y="267">«boundary»</tspan></text><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="300" y="314">Review Page</tspan></text><rect x="418" y="240" width="204" height="105" fill="#83CDE5" stroke="#455A64"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="520" y="267">«controller»</tspan></text><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="520" y="302">ServiceReview</tspan><tspan x="520" y="326">Controller</tspan></text><rect x="648" y="240" width="204" height="105" fill="#83CDE5" stroke="#455A64"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="750" y="267">«service»</tspan></text><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="750" y="302">ServiceReview</tspan><tspan x="750" y="326">Service</tspan></text><rect x="998" y="240" width="204" height="105" fill="#83CDE5" stroke="#455A64"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="1100" y="267">«repositories»</tspan></text><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="1100" y="302">Persistence</tspan><tspan x="1100" y="326">(grouped)</tspan></text><rect x="1258" y="240" width="204" height="105" fill="#83CDE5" stroke="#455A64"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="1360" y="267">«service»</tspan></text><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="1360" y="314">NoticeService</tspan></text><path d="M 80 364 L 80 2570" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><path d="M 300 364 L 300 2570" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><path d="M 520 364 L 520 2570" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><path d="M 750 364 L 750 2570" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><path d="M 1100 364 L 1100 2570" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><path d="M 1360 364 L 1360 2570" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><rect x="75" y="415" width="10" height="2120" fill="#83CDE5" stroke="#455A64"/><rect x="295" y="415" width="10" height="2055" fill="#83CDE5" stroke="#455A64"/><rect x="515" y="485" width="10" height="1915" fill="#83CDE5" stroke="#455A64"/><rect x="745" y="555" width="10" height="1775" fill="#83CDE5" stroke="#455A64"/><rect x="670" y="955" width="780" height="1155" fill="none" stroke="#617B88"/><rect x="670" y="955" width="63" height="32" fill="#EAF3F7" stroke="#617B88"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="701.5" y="978">alt</tspan></text><rect x="690" y="1240" width="735" height="510" fill="none" stroke="#617B88"/><rect x="690" y="1240" width="63" height="32" fill="#EAF3F7" stroke="#617B88"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="middle"><tspan x="721.5" y="1263">alt</tspan></text><path d="M 690 1590 L 1425 1590" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><path d="M 670 1820 L 1450 1820" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" /><path d="M 85 415 L 295 415" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="91" y="361" width="198" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="190" y="380">1. Select decision</tspan><tspan x="190" y="404">and confirm</tspan></text><path d="M 305 485 L 515 485" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="311" y="431" width="198" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="410" y="450">2. POST /review or</tspan><tspan x="410" y="474">/supplement-request</tspan></text><path d="M 525 555 L 745 555" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="531" y="501" width="208" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="635" y="520">3. review(...) or</tspan><tspan x="635" y="544">requestSupplement(...)</tspan></text><path d="M 755 605 H 795 V 633 H 755" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="805" y="595" width="490" height="72" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="807" y="614">4. Require active STAFF / ADMIN.</tspan><tspan x="807" y="638">Review: validate decisions and reason;</tspan><tspan x="807" y="662">use default approval reason if blank.</tspan></text><path d="M 755 755 L 1095 755" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="761" y="701" width="328" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="925" y="720">5. findForReview(id)</tspan><tspan x="925" y="744">Lock application</tspan></text><rect x="1095" y="755" width="10" height="22" fill="#83CDE5" stroke="#455A64"/><path d="M 1095 805 L 755 805" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="761" y="775" width="328" height="24" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="925" y="794">6. Application</tspan></text><path d="M 755 850 H 795 V 878 H 755" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="805" y="840" width="490" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="807" y="859">7. Reject self-review; require PENDING</tspan><tspan x="807" y="883">and matching application revision.</tspan></text><rect x="690" y="995" width="740" height="30" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="692" y="1017">[Approve or Reject]</tspan></text><path d="M 755 1100 L 1095 1100" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="761" y="1046" width="328" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="925" y="1065">8. Lock applicant account;</tspan><tspan x="925" y="1089">require ACTIVE</tspan></text><rect x="1095" y="1100" width="10" height="22" fill="#83CDE5" stroke="#455A64"/><path d="M 755 1190 L 1095 1190" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="761" y="1160" width="328" height="24" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="925" y="1179">9. Load optional documents</tspan></text><rect x="1095" y="1190" width="10" height="22" fill="#83CDE5" stroke="#455A64"/><rect x="805" y="1280" width="560" height="30" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="807" y="1302">[APPROVE / APPROVE]</tspan></text><path d="M 755 1390 L 1095 1390" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="761" y="1312" width="328" height="72" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="925" y="1331">10. Validate stored documents;</tspan><tspan x="925" y="1355">get MANAGE_SERVICE;</tspan><tspan x="925" y="1379">save ACTIVE grant if needed</tspan></text><rect x="1095" y="1390" width="10" height="22" fill="#83CDE5" stroke="#455A64"/><path d="M 755 1500 L 1095 1500" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="761" y="1422" width="328" height="72" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="925" y="1441">11. Check duplicate name / listing;</tspan><tspan x="925" y="1465">validate fields; save ACTIVE</tspan><tspan x="925" y="1489">Service linked to this snapshot</tspan></text><rect x="1095" y="1500" width="10" height="22" fill="#83CDE5" stroke="#455A64"/><rect x="805" y="1605" width="560" height="30" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="807" y="1627">[REJECT / REJECT]</tspan></text><rect x="820" y="1650" width="575" height="65" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="822" y="1677.5">12. Do not create a Service</tspan><tspan x="822" y="1701.5">or revoke an existing capability.</tspan></text><path d="M 755 1770 H 795 V 1798 H 755" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="805" y="1760" width="490" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="807" y="1779">13. Set APPROVED or REJECTED;</tspan><tspan x="807" y="1803">store decisions; update document status.</tspan></text><rect x="690" y="1840" width="740" height="30" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="700" text-anchor="start"><tspan x="692" y="1862">[Request supplement]</tspan></text><path d="M 755 1900 H 795 V 1928 H 755" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="805" y="1890" width="490" height="72" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="807" y="1909">14. Validate reason: 10–2000 characters.</tspan><tspan x="807" y="1933">Set NEEDS_SUPPLEMENT,</tspan><tspan x="807" y="1957">requestedChanges and supplement time.</tspan></text><rect x="800" y="2020" width="620" height="65" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="802" y="2047.5">No applicant-account lock in this branch.</tspan><tspan x="802" y="2071.5">Capability and public listing remain unchanged.</tspan></text><path d="M 755 2150 H 795 V 2178 H 755" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="805" y="2140" width="490" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="807" y="2159">15. Set reviewer, reviewedAt and reason;</tspan><tspan x="807" y="2183">increment application revision.</tspan></text><path d="M 755 2250 L 1095 2250" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="761" y="2196" width="328" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="925" y="2215">16. saveAndFlush(application);</tspan><tspan x="925" y="2239">saveAndFlush(moderation log)</tspan></text><rect x="1095" y="2250" width="10" height="22" fill="#83CDE5" stroke="#455A64"/><path d="M 755 2345 L 1355 2345" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="761" y="2291" width="588" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="1055" y="2310">17. send(applicant, APPLICATION, result, ...)</tspan><tspan x="1055" y="2334">Save notice and publish update event</tspan></text><rect x="1355" y="2345" width="10" height="22" fill="#83CDE5" stroke="#455A64"/><path d="M 755 2405 H 795 V 2433 H 755" fill="none" stroke="#455A64" stroke-width="1.3"  marker-end="url(#arrow)"/><rect x="805" y="2395" width="490" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="807" y="2414">18. detail(id): application + audit history</tspan><tspan x="807" y="2438">and current listing snapshot, if present.</tspan></text><path d="M 745 2490 L 525 2490" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="531" y="2436" width="208" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="635" y="2455">19. Detail;</tspan><tspan x="635" y="2479">transaction commits</tspan></text><path d="M 515 2565 L 305 2565" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="311" y="2511" width="198" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="410" y="2530">20. HTTP 200</tspan><tspan x="410" y="2554">ApiResponse&lt;Detail&gt;</tspan></text><path d="M 295 2640 L 85 2640" fill="none" stroke="#455A64" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="91" y="2586" width="198" height="48" fill="#FFFFFF"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="middle"><tspan x="190" y="2605">21. Show result</tspan><tspan x="190" y="2629">and review history</tspan></text><rect x="75" y="2535" width="10" height="110" fill="#83CDE5" stroke="#455A64"/><rect x="295" y="2470" width="10" height="175" fill="#83CDE5" stroke="#455A64"/><rect x="515" y="2400" width="10" height="170" fill="#83CDE5" stroke="#455A64"/><rect x="745" y="2330" width="10" height="165" fill="#83CDE5" stroke="#455A64"/><rect x="24" y="2690" width="1442" height="190" fill="#FFFDEB" stroke="#D8D0AA"/><text font-family="Arial" font-size="20" fill="#172B35" font-weight="400" text-anchor="start"><tspan x="42" y="2721">Scope and source mapping</tspan><tspan x="42" y="2745">Persistence is a visual group, not a new class: ServiceRegistrationRepository, UserRepository,</tspan><tspan x="42" y="2769">ServiceDocumentRepository, CapabilityRepository, UserCapabilityRepository, ServiceRepository,</tspan><tspan x="42" y="2793">and ModerationLogRepository. NoticeService saves UserNotice internally.</tspan><tspan x="42" y="2817">Review reason: rejection requires 10–2000 characters; approval may use the default reason.</tspan><tspan x="42" y="2841">Errors stop the flow and roll back writes: 400 invalid data, 403 forbidden, 404 missing, 409 conflict.</tspan><tspan x="42" y="2865">No staff assignment is required. Existing account role is unchanged. AI review is outside this diagram.</tspan></text></svg>
