>- createdAt: LocalDateTime</tspan></text><text x="575" y="229" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="575" dy="0">uses</tspan></text><text x="1200" y="202" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="1200" dy="0">uses</tspan></text><text x="1205" y="480" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="1205" dy="0">uses</tspan></text><text x="430" y="689" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="430" dy="0">manages ServiceComplaint</tspan></text><text x="975" y="649" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="975" dy="0">manages events</tspan></text><text x="566" y="815" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="566" dy="0">complaint</tspan><tspan x="566" dy="21">0..* → 1</tspan></text><text x="315" y="1207" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="315" dy="0">0..* reports → 1 service</tspan></text><text x="1195" y="815" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="1195" dy="0">actor</tspan><tspan x="1195" dy="21">0..* → 1</tspan></text><text x="975" y="710" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="975" dy="0">0..* reports → 1 reporter</tspan></text><text x="1290" y="1077" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="1290" dy="0">0..* services → 1 provider</tspan></text><text x="1565" y="1005" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="1565" dy="0">0..* logs → 1 staff</tspan></text><text x="630" y="1193" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="630" dy="0">1 owner ◆ 0..* images</tspan></text><text x="1015" y="1155" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="1015" dy="0">1 owner ◆ 0..* images</tspan></text><rect x="40" y="1515" width="1790" height="125" fill="#f0fdfa"/><text x="52" y="1538" font-family="Arial" font-size="13" fill="#172b3a"><tspan x="52" dy="0">Scope: shared by Submit Service Complaint, Review Service Complaint and Respond to Staff Request.</tspan><tspan x="52" dy="21">status and outcome are String fields, not Java enums. New status values: PENDING / RESOLVED; outcomes: DISMISS / REMOVE.</tspan><tspan x="52" dy="21">ModerationLog.targetId is a scalar identifier, not a JPA relationship to ServiceComplaint. DTO records and unrelated members are omitted.</tspan><tspan x="52" dy="21">Solid arrows: navigable associations; dashed arrows: dependencies; filled diamonds: owned image values. Multiplicities are shown in relationship labels.</tspan></text><text x="40" y="58" font-family="Arial" font-size="30" fill="#172b3a"><tspan x="40" dy="0">Service Complaint — Class Diagram</tspan></text><text x="40" y="99" font-family="Arial" font-size="16" fill="#172b3a"><tspan x="40" dy="0">Source-based view of the shared backend model and application classes</tspan></text></svg>