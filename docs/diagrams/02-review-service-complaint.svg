span></text><line x1="900" y1="502" x2="610" y2="502" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="755" y="492" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">6: return Detail + permissions</tspan></text><line x1="610" y1="554" x2="320" y2="554" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="465" y="544" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">7: return Detail</tspan></text><line x1="320" y1="606" x2="85" y2="606" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="202.5" y="596" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">8: display complaint</tspan></text><line x1="85" y1="658" x2="320" y2="658" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="648" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">9: choose action; enter reason</tspan></text><text x="52" y="698" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="52" dy="0">alt</tspan></text><text x="90" y="698" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">Request provider response — optional</tspan></text><line x1="320" y1="762" x2="610" y2="762" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="735" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">10: review(id, revision,</tspan><tspan x="465" dy="17">REQUEST_EXPLANATION, reason)</tspan></text><line x1="610" y1="814" x2="900" y2="814" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="804" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">11: review(...)</tspan></text><line x1="900" y1="866" x2="1200" y2="866" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="839" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">12: keep PENDING; request response;</tspan><tspan x="1050" dy="17">save event, audit and revision</tspan></text><path d="M30 878 H1370" stroke="#64748b" stroke-dasharray="5 4"/><text x="90" y="901" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">DISMISS — no removal</tspan></text><line x1="320" y1="966" x2="610" y2="966" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="939" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">13: review(id, revision,</tspan><tspan x="465" dy="17">DISMISS, reason)</tspan></text><line x1="610" y1="1018" x2="900" y2="1018" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="1008" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">14: review(...)</tspan></text><line x1="900" y1="1070" x2="1200" y2="1070" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1043" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">15: save RESOLVED + DISMISS;</tspan><tspan x="1050" dy="17">clear request; save audit</tspan></text><path d="M30 1082 H1370" stroke="#64748b" stroke-dasharray="5 4"/><text x="90" y="1105" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">REMOVE — staff confirms removal</tspan></text><line x1="320" y1="1170" x2="610" y2="1170" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="1143" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">16: review(id, revision,</tspan><tspan x="465" dy="17">REMOVE, reason)</tspan></text><line x1="610" y1="1222" x2="900" y2="1222" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="1212" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">17: review(...)</tspan></text><line x1="900" y1="1274" x2="1200" y2="1274" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1247" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">18: save RESOLVED + REMOVE;</tspan><tspan x="1050" dy="17">hide service; clear request; audit</tspan></text><line x1="900" y1="1344" x2="610" y2="1344" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="755" y="1334" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">19: return updated Detail</tspan></text><line x1="610" y1="1396" x2="320" y2="1396" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="465" y="1386" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">20: return result</tspan></text><line x1="320" y1="1448" x2="85" y2="1448" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="202.5" y="1421" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">21: display request confirmation</tspan><tspan x="202.5" dy="17">or final outcome</tspan></text><text x="30" y="1548" font-family="Arial" font-size="13" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Review checks staff access, conflicts of interest and revision. DISMISS never restores a previously hidden service.</tspan></text></svg>