<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3442" viewBox="0 0 1800 3442"><defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#374151"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:14px;fill:#111827}.message{font-size:14px}text[font-size="30"]{font-size:30px}</style>
<text x="40" y="45" font-size="30" font-weight="bold"><tspan x="40" dy="0">Service Complaint Handling</tspan></text>
<text x="40" y="77" font-style="italic"><tspan x="40" dy="0">Sequence Diagram — Report, Request a Provider Response, and Resolve</tspan></text>
<circle cx="95" cy="115" r="9" fill="white" stroke="#6b7280"/><path d="M95 124 v27 m-18 -18 h36 m-18 18 l-16 19 m16 -19 l16 19" fill="none" stroke="#6b7280"/><text x="95" y="192" text-anchor="middle" font-size="12"><tspan x="95" dy="0">REPORTER</tspan></text>
<line x1="95" x2="95" y1="205" y2="3352" stroke="#858585" stroke-dasharray="5 5"/>
<circle cx="265" cy="115" r="9" fill="white" stroke="#6b7280"/><path d="M265 124 v27 m-18 -18 h36 m-18 18 l-16 19 m16 -19 l16 19" fill="none" stroke="#6b7280"/><text x="265" y="192" text-anchor="middle" font-size="12"><tspan x="265" dy="0">SERVICE PROVIDER</tspan></text>
<line x1="265" x2="265" y1="205" y2="3352" stroke="#858585" stroke-dasharray="5 5"/>
<circle cx="435" cy="115" r="9" fill="white" stroke="#6b7280"/><path d="M435 124 v27 m-18 -18 h36 m-18 18 l-16 19 m16 -19 l16 19" fill="none" stroke="#6b7280"/><text x="435" y="192" text-anchor="middle" font-size="12"><tspan x="435" dy="0">STAFF / ADMIN</tspan></text>
<line x1="435" x2="435" y1="205" y2="3352" stroke="#858585" stroke-dasharray="5 5"/>
<rect x="542" y="108" width="266" height="82" fill="#a9dde7" stroke="#64858c"/><text x="675" y="135" text-anchor="middle"><tspan x="675" dy="0">ServiceComplaints</tspan><tspan x="675" dy="17">«UI»</tspan></text>
<line x1="675" x2="675" y1="205" y2="3352" stroke="#858585" stroke-dasharray="5 5"/>
<rect x="671" y="255" width="8" height="3077" fill="#b7e4ed" stroke="#64858c"/>
<rect x="837" y="108" width="266" height="82" fill="#a9dde7" stroke="#64858c"/><text x="970" y="135" text-anchor="middle"><tspan x="970" dy="0">ServiceComplaintController</tspan><tspan x="970" dy="17">«Controller»</tspan></text>
<line x1="970" x2="970" y1="205" y2="3352" stroke="#858585" stroke-dasharray="5 5"/>
<rect x="966" y="255" width="8" height="3077" fill="#b7e4ed" stroke="#64858c"/>
<rect x="1142" y="108" width="266" height="82" fill="#a9dde7" stroke="#64858c"/><text x="1275" y="135" text-anchor="middle"><tspan x="1275" dy="0">ServiceComplaintService</tspan><tspan x="1275" dy="17">«Service»</tspan></text>
<line x1="1275" x2="1275" y1="205" y2="3352" stroke="#858585" stroke-dasharray="5 5"/>
<rect x="1271" y="255" width="8" height="3077" fill="#b7e4ed" stroke="#64858c"/>
<rect x="1462" y="108" width="266" height="82" fill="#a9dde7" stroke="#64858c"/><text x="1595" y="135" text-anchor="middle"><tspan x="1595" dy="0">Complaint / Event</tspan><tspan x="1595" dy="17">Service / ModerationLog</tspan><tspan x="1595" dy="17">«Entity»</tspan></text>
<line x1="1595" x2="1595" y1="205" y2="3352" stroke="#858585" stroke-dasharray="5 5"/>
<rect x="1591" y="255" width="8" height="3077" fill="#b7e4ed" stroke="#64858c"/>
<rect x="35" y="1280" width="1730" height="1276" fill="none" stroke="#64748b"/><path d="M35 1280 h46 v18 l-10 9 h-36 Z" fill="white" stroke="#64748b"/><text x="44" y="1298" ><tspan x="44" dy="0">opt</tspan></text><text x="100" y="1300" font-style="italic"><tspan x="100" dy="0">Additional information is needed; no response request is outstanding</tspan></text>
<rect x="65" y="1740" width="1700" height="796" fill="none" stroke="#64748b"/><path d="M65 1740 h46 v18 l-10 9 h-36 Z" fill="white" stroke="#64748b"/><text x="74" y="1758" ><tspan x="74" dy="0">opt</tspan></text><text x="130" y="1760" font-style="italic"><tspan x="130" dy="0">The provider responds before the report is resolved</tspan></text>
<rect x="35" y="2822" width="1730" height="218" fill="none" stroke="#64748b"/><path d="M35 2822 h46 v18 l-10 9 h-36 Z" fill="white" stroke="#64748b"/><text x="44" y="2840" ><tspan x="44" dy="0">alt</tspan></text><text x="100" y="2842" font-style="italic"><tspan x="100" dy="0">DISMISS — no removal</tspan></text>
<rect x="35" y="228" width="1730" height="32" fill="#f1f5f9"/><text x="52" y="250" font-weight="bold"><tspan x="52" dy="0">1. Submit a complaint</tspan></text>
<line x1="100" y1="318" x2="670" y2="318" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="385" y="308" text-anchor="middle" class="message"><tspan x="385" dy="0">1: submitReport(content, images)</tspan></text>
<line x1="680" y1="376" x2="965" y2="376" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="822.5" y="366" text-anchor="middle" class="message"><tspan x="822.5" dy="0">2: submit(serviceId, content, images)</tspan></text>
<line x1="975" y1="434" x2="1270" y2="434" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1122.5" y="424" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">3: submit(serviceId, content, images)</tspan></text>
<line x1="1280" y1="492" x2="1590" y2="492" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1435" y="465" text-anchor="middle" class="message"><tspan x="1435" dy="0">4: save validated complaint</tspan><tspan x="1435" dy="17">status = PENDING</tspan></text>
<line x1="1590" y1="550" x2="1280" y2="550" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1435" y="540" text-anchor="middle" class="message"><tspan x="1435" dy="0">5: saved complaint</tspan></text>
<line x1="1270" y1="608" x2="975" y2="608" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1122.5" y="598" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">6: return Detail</tspan></text>
<line x1="965" y1="666" x2="680" y2="666" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="822.5" y="656" text-anchor="middle" class="message"><tspan x="822.5" dy="0">7: 201 Created + Detail</tspan></text>
<line x1="670" y1="724" x2="100" y2="724" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="385" y="714" text-anchor="middle" class="message"><tspan x="385" dy="0">8: display receipt and tracking link</tspan></text>
<rect x="35" y="752" width="1730" height="32" fill="#f1f5f9"/><text x="52" y="774" font-weight="bold"><tspan x="52" dy="0">2. Review the complaint</tspan></text>
<line x1="440" y1="842" x2="670" y2="842" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="555" y="832" text-anchor="middle" class="message"><tspan x="555" dy="0">9: openComplaint(id)</tspan></text>
<line x1="680" y1="900" x2="965" y2="900" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="822.5" y="890" text-anchor="middle" class="message"><tspan x="822.5" dy="0">10: detail(id)</tspan></text>
<line x1="975" y1="958" x2="1270" y2="958" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1122.5" y="948" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">11: detail(id): check access</tspan></text>
<line x1="1280" y1="1016" x2="1590" y2="1016" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1435" y="1006" text-anchor="middle" class="message"><tspan x="1435" dy="0">12: load complaint, evidence and history</tspan></text>
<line x1="1590" y1="1074" x2="1280" y2="1074" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1435" y="1064" text-anchor="middle" class="message"><tspan x="1435" dy="0">13: return complaint data</tspan></text>
<line x1="1270" y1="1132" x2="975" y2="1132" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1122.5" y="1122" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">14: return Detail + permissions</tspan></text>
<line x1="965" y1="1190" x2="680" y2="1190" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="822.5" y="1180" text-anchor="middle" class="message"><tspan x="822.5" dy="0">15: return result</tspan></text>
<line x1="670" y1="1248" x2="440" y2="1248" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="555" y="1238" text-anchor="middle" class="message"><tspan x="555" dy="0">16: display complaint</tspan></text>
<line x1="440" y1="1360" x2="670" y2="1360" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="555" y="1350" text-anchor="middle" class="message"><tspan x="555" dy="0">17: requestProviderResponse(reason)</tspan></text>
<line x1="680" y1="1418" x2="965" y2="1418" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="822.5" y="1391" text-anchor="middle" class="message"><tspan x="822.5" dy="0">18: review(id, revision,</tspan><tspan x="822.5" dy="17">REQUEST_EXPLANATION, reason)</tspan></text>
<line x1="975" y1="1476" x2="1270" y2="1476" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1122.5" y="1466" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">19: review(...)</tspan></text>
<line x1="1280" y1="1534" x2="1590" y2="1534" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1435" y="1507" text-anchor="middle" class="message"><tspan x="1435" dy="0">20: keep PENDING; responseRequested = true</tspan><tspan x="1435" dy="17">append event and audit; increment revision</tspan></text>
<line x1="1270" y1="1592" x2="975" y2="1592" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1122.5" y="1582" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">21: return updated Detail</tspan></text>
<line x1="965" y1="1650" x2="680" y2="1650" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="822.5" y="1640" text-anchor="middle" class="message"><tspan x="822.5" dy="0">22: return result</tspan></text>
<line x1="670" y1="1708" x2="440" y2="1708" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="555" y="1698" text-anchor="middle" class="message"><tspan x="555" dy="0">23: display request confirmation</tspan></text>
<line x1="270" y1="1820" x2="670" y2="1820" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="470" y="1810" text-anchor="middle" class="message"><tspan x="470" dy="0">24: open staff request and read instructions</tspan></text>
<line x1="680" y1="1878" x2="965" y2="1878" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="822.5" y="1868" text-anchor="middle" class="message"><tspan x="822.5" dy="0">25: detail(id)</tspan></text>
<line x1="975" y1="1936" x2="1270" y2="1936" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1122.5" y="1926" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">26: detail(id): check ownership</tspan></text>
<line x1="1270" y1="1994" x2="975" y2="1994" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1122.5" y="1984" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">27: return Detail + canExplain</tspan></text>
<line x1="965" y1="2052" x2="680" y2="2052" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="822.5" y="2042" text-anchor="middle" class="message"><tspan x="822.5" dy="0">28: return staff request</tspan></text>
<line x1="670" y1="2110" x2="270" y2="2110" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="470" y="2100" text-anchor="middle" class="message"><tspan x="470" dy="0">29: display staff request and response form</tspan></text>
<line x1="270" y1="2168" x2="670" y2="2168" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="470" y="2158" text-anchor="middle" class="message"><tspan x="470" dy="0">30: sendResponseToStaff(content, images)</tspan></text>
<line x1="680" y1="2226" x2="965" y2="2226" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="822.5" y="2216" text-anchor="middle" class="message"><tspan x="822.5" dy="0">31: explain(id, revision, content, images)</tspan></text>
<line x1="975" y1="2284" x2="1270" y2="2284" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1122.5" y="2274" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">32: explain(...): verify pending request</tspan></text>
<line x1="1280" y1="2342" x2="1590" y2="2342" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1435" y="2315" text-anchor="middle" class="message"><tspan x="1435" dy="0">33: keep PENDING; responseRequested = false</tspan><tspan x="1435" dy="17">save response event, images and audit</tspan></text>
<line x1="1270" y1="2400" x2="975" y2="2400" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1122.5" y="2390" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">34: return updated Detail</tspan></text>
<line x1="965" y1="2458" x2="680" y2="2458" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="822.5" y="2448" text-anchor="middle" class="message"><tspan x="822.5" dy="0">35: return result</tspan></text>
<line x1="670" y1="2516" x2="270" y2="2516" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="470" y="2506" text-anchor="middle" class="message"><tspan x="470" dy="0">36: display response confirmation</tspan></text>
<rect x="35" y="2584" width="1730" height="32" fill="#f1f5f9"/><text x="52" y="2606" font-weight="bold"><tspan x="52" dy="0">3. Resolve the complaint</tspan></text>
<line x1="440" y1="2674" x2="670" y2="2674" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="555" y="2664" text-anchor="middle" class="message"><tspan x="555" dy="0">37: review available evidence; choose decision</tspan></text>
<line x1="680" y1="2732" x2="965" y2="2732" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="822.5" y="2722" text-anchor="middle" class="message"><tspan x="822.5" dy="0">38: review(id, revision, action, reason)</tspan></text>
<line x1="975" y1="2790" x2="1270" y2="2790" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1122.5" y="2763" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">39: review(...): check staff access,</tspan><tspan x="1122.5" dy="17">conflict of interest and revision</tspan></text>
<line x1="1280" y1="2902" x2="1590" y2="2902" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1435" y="2875" text-anchor="middle" class="message"><tspan x="1435" dy="0">40: save RESOLVED + outcome DISMISS</tspan><tspan x="1435" dy="17">preserve current publication state</tspan></text>
<line x1="35" x2="1765" y1="2937" y2="2937" stroke="#6b7280" stroke-dasharray="5 4"/>
<text x="100" y="2960" font-style="italic"><tspan x="100" dy="0">REMOVE — staff confirms removal</tspan></text>
<line x1="1280" y1="3020" x2="1590" y2="3020" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1435" y="2993" text-anchor="middle" class="message"><tspan x="1435" dy="0">41: save RESOLVED + outcome REMOVE</tspan><tspan x="1435" dy="17">set moderationHidden = true</tspan></text>
<line x1="1280" y1="3098" x2="1590" y2="3098" stroke="#374151" stroke-width="1.2"  marker-end="url(#arrow)"/>
<text x="1435" y="3071" text-anchor="middle" class="message"><tspan x="1435" dy="0">42: clear response request; increment revision</tspan><tspan x="1435" dy="17">append decision event and moderation audit</tspan></text>
<line x1="1270" y1="3156" x2="975" y2="3156" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1122.5" y="3146" text-anchor="middle" class="message"><tspan x="1122.5" dy="0">43: return updated Detail</tspan></text>
<line x1="965" y1="3214" x2="680" y2="3214" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="822.5" y="3204" text-anchor="middle" class="message"><tspan x="822.5" dy="0">44: return result</tspan></text>
<line x1="670" y1="3272" x2="440" y2="3272" stroke="#374151" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="555" y="3262" text-anchor="middle" class="message"><tspan x="555" dy="0">45: display outcome and reason</tspan></text>
<text x="40" y="3407" font-size="15"><tspan x="40" dy="0">Status: PENDING or RESOLVED. Provider responses go to staff. Requesting a response is optional; silence never triggers automatic removal.</tspan></text>
</svg>