<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1680" viewBox="0 0 1840 1680"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172b3a;font-size:15px}.label{font-size:14px}.title{font-size:30px;font-weight:bold}.subtitle{font-size:18px;font-style:italic}.line{stroke:#475569;stroke-width:1.2}.life{stroke:#94a3b8;stroke-dasharray:6 5}</style><text class="title" x="40" y="48">Service Complaint Resolution</text><text class="subtitle" x="40" y="80">Sequence Diagram — Submission, Optional Provider Response, and Staff Decision</text>
<rect x="12" y="112" width="196" height="60" fill="#b2e0e8" stroke="#55818a"/><text text-anchor="middle" x="110" y="138" class="label">Reporter</text><text text-anchor="middle" x="110" y="159" class="label">«Actor»</text><line class="life" x1="110" x2="110" y1="172" y2="1590"/>
<rect x="222" y="112" width="196" height="60" fill="#b2e0e8" stroke="#55818a"/><text text-anchor="middle" x="320" y="138" class="label">Service Provider</text><text text-anchor="middle" x="320" y="159" class="label">«Actor»</text><line class="life" x1="320" x2="320" y1="172" y2="1590"/>
<rect x="432" y="112" width="196" height="60" fill="#b2e0e8" stroke="#55818a"/><text text-anchor="middle" x="530" y="138" class="label">Staff / Admin</text><text text-anchor="middle" x="530" y="159" class="label">«Actor»</text><line class="life" x1="530" x2="530" y1="172" y2="1590"/>
<rect x="672" y="112" width="196" height="60" fill="#b2e0e8" stroke="#55818a"/><text text-anchor="middle" x="770" y="138" class="label">Complaint UI</text><text text-anchor="middle" x="770" y="159" class="label">«UI»</text><line class="life" x1="770" x2="770" y1="172" y2="1590"/>
<rect x="952" y="112" width="196" height="60" fill="#b2e0e8" stroke="#55818a"/><text text-anchor="middle" x="1050" y="138" class="label">ServiceComplaintController</text><text text-anchor="middle" x="1050" y="159" class="label">«Controller»</text><line class="life" x1="1050" x2="1050" y1="172" y2="1590"/>
<rect x="1262" y="112" width="196" height="60" fill="#b2e0e8" stroke="#55818a"/><text text-anchor="middle" x="1360" y="138" class="label">ServiceComplaintService</text><text text-anchor="middle" x="1360" y="159" class="label">«Service»</text><line class="life" x1="1360" x2="1360" y1="172" y2="1590"/>
<rect x="1582" y="112" width="196" height="60" fill="#b2e0e8" stroke="#55818a"/><text text-anchor="middle" x="1680" y="138" class="label">Complaint / Event / Service</text><text text-anchor="middle" x="1680" y="159" class="label">«Entity»</text><line class="life" x1="1680" x2="1680" y1="172" y2="1590"/>
<line class="line" x1="110" x2="770" y1="215" y2="215"  marker-end="url(#arrow)"/><text text-anchor="middle" x="440" y="206" class="label">1. Submit content and optional evidence</text>
<line class="line" x1="770" x2="1050" y1="260" y2="260"  marker-end="url(#arrow)"/><text text-anchor="middle" x="910" y="251" class="label">2. POST /api/service-complaints</text>
<line class="line" x1="1050" x2="1360" y1="305" y2="305"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1205" y="296" class="label">3. submit(serviceId, content, images)</text>
<line class="line" x1="1360" x2="1680" y1="350" y2="350"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1520" y="341" class="label">4. Validate access; save PENDING report</text>
<line class="line" x1="1680" x2="1360" y1="395" y2="395" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text text-anchor="middle" x="1520" y="386" class="label">5. Report and revision</text>
<line class="line" x1="1360" x2="770" y1="440" y2="440" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text text-anchor="middle" x="1065" y="431" class="label">6. Return detail via controller</text>
<line class="line" x1="770" x2="110" y1="485" y2="485" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text text-anchor="middle" x="440" y="476" class="label">7. Show receipt and tracking link</text>
<line class="line" x1="530" x2="770" y1="535" y2="535"  marker-end="url(#arrow)"/><text text-anchor="middle" x="650" y="526" class="label">8. Open report</text>
<line class="line" x1="770" x2="1050" y1="580" y2="580"  marker-end="url(#arrow)"/><text text-anchor="middle" x="910" y="571" class="label">9. GET /api/service-complaints/{id}</text>
<line class="line" x1="1050" x2="1360" y1="625" y2="625"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1205" y="616" class="label">10. detail(id): authorize and load</text>
<line class="line" x1="1360" x2="770" y1="670" y2="670" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text text-anchor="middle" x="1065" y="661" class="label">11. Return evidence, history and permissions</text>
<rect x="32" y="700" width="1768" height="375" fill="none" stroke="#64748b"/><rect x="32" y="700" width="48" height="25" fill="white" stroke="#64748b"/><text x="42" y="718">opt</text><text x="96" y="723" font-style="italic">More information needed — report remains PENDING</text>
<line class="line" x1="530" x2="770" y1="755" y2="755"  marker-end="url(#arrow)"/><text text-anchor="middle" x="650" y="746" class="label">12. Request provider response with a reason</text>
<line class="line" x1="770" x2="1360" y1="800" y2="800"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1065" y="791" class="label">13. review(id, revision, REQUEST_EXPLANATION, reason) via controller</text>
<line class="line" x1="1360" x2="1680" y1="845" y2="845"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1520" y="836" class="label">14. Set responseRequested = true; append event; increment revision</text>
<line class="line" x1="320" x2="770" y1="890" y2="890"  marker-end="url(#arrow)"/><text text-anchor="middle" x="545" y="881" class="label">15. Open request; submit response and optional evidence</text>
<line class="line" x1="770" x2="1050" y1="935" y2="935"  marker-end="url(#arrow)"/><text text-anchor="middle" x="910" y="926" class="label">16. POST /api/service-complaints/{id}/explanation</text>
<line class="line" x1="1050" x2="1360" y1="980" y2="980"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1205" y="971" class="label">17. explain(id, revision, content, images)</text>
<line class="line" x1="1360" x2="1680" y1="1025" y2="1025"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1520" y="1016" class="label">18. Clear responseRequested; append response event; increment revision</text>
<line class="line" x1="530" x2="770" y1="1120" y2="1120"  marker-end="url(#arrow)"/><text text-anchor="middle" x="650" y="1111" class="label">19. Choose a final decision and enter a reason</text>
<line class="line" x1="770" x2="1050" y1="1165" y2="1165"  marker-end="url(#arrow)"/><text text-anchor="middle" x="910" y="1156" class="label">20. POST /api/staff/service-complaints/{id}/review</text>
<line class="line" x1="1050" x2="1360" y1="1210" y2="1210"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1205" y="1201" class="label">21. review(id, revision, action, reason)</text>
<rect x="32" y="1235" width="1768" height="220" fill="none" stroke="#64748b"/><rect x="32" y="1235" width="48" height="25" fill="white" stroke="#64748b"/><text x="42" y="1253">alt</text><text x="96" y="1258" font-style="italic">DISMISS — do not remove the service</text>
<line class="line" x1="1360" x2="1680" y1="1290" y2="1290"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1520" y="1281" class="label">22. Save RESOLVED + DISMISS; preserve current publication state</text>
<line x1="32" x2="1800" y1="1325" y2="1325" stroke="#64748b" stroke-dasharray="5 4"/><text x="96" y="1350" font-style="italic">REMOVE — staff confirms removal</text>
<line class="line" x1="1360" x2="1680" y1="1400" y2="1400"  marker-end="url(#arrow)"/><text text-anchor="middle" x="1520" y="1391" class="label">23. Save RESOLVED + REMOVE; set moderationHidden = true</text>
<line class="line" x1="1360" x2="770" y1="1500" y2="1500" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text text-anchor="middle" x="1065" y="1491" class="label">24. Append audit; clear response request; return updated detail</text>
<line class="line" x1="770" x2="530" y1="1545" y2="1545" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text text-anchor="middle" x="650" y="1536" class="label">25. Display outcome and reason</text>
<rect x="40" y="1610" width="1760" height="45" rx="4" fill="#f0fdfa"/><text x="60" y="1638">Two statuses: PENDING / RESOLVED. Responses are optional. Decisions require staff authorization and a current revision. No automatic removal or restoration.</text></svg>