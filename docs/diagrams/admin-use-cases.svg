"#254334"><tspan x="447.5" dy="0">UC-AD09</tspan><tspan x="447.5" dy="19">Manage own profile</tspan><tspan x="447.5" dy="19">and credentials</tspan></text><ellipse cx="802.5" cy="1412" rx="147.5" ry="38" fill="#D4EAD7" stroke="#6F9675" stroke-width="1.3"/><text x="802.5" y="1399.5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#254334"><tspan x="802.5" dy="0">UC-AD10</tspan><tspan x="802.5" dy="19">Read and manage</tspan><tspan x="802.5" dy="19">own notifications</tspan></text><ellipse cx="1157.5" cy="1412" rx="147.5" ry="38" fill="#EADCF2" stroke="#9468A6" stroke-width="1.3"/><text x="1157.5" y="1399.5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#254334"><tspan x="1157.5" dy="0">UC-AD11</tspan><tspan x="1157.5" dy="19">Sign in and</tspan><tspan x="1157.5" dy="19">sign out</tspan></text><circle cx="1450" cy="858" r="12" fill="#e1efd9" stroke="#4c795b"/><path d="M1450 870 v34 m-26 -21 h52 m-26 21 l-26 30 m26 -30 l26 30" fill="none" stroke="#4c795b" stroke-width="1.6"/><circle cx="1450" cy="1232" r="12" fill="#e1efd9" stroke="#4c795b"/><path d="M1450 1244 v34 m-26 -21 h52 m-26 21 l-26 30 m26 -30 l26 30" fill="none" stroke="#4c795b" stroke-width="1.6"/><text x="35" y="52" text-anchor="start" font-family="Arial" font-size="30" fill="#254334" font-weight="bold"><tspan x="35" dy="0">Admin Use Case Diagram</tspan></text><text x="37" y="85.9" text-anchor="start" font-family="Arial" font-size="16" fill="#254334" ><tspan x="37" dy="0">NestHub • Current implementation • Every use case has a unique UC_ID</tspan></text><text x="770" y="138.6" text-anchor="middle" font-family="Arial" font-size="19" fill="#254334" font-weight="bold"><tspan x="770" dy="0">NestHub System — Admin Operations</tspan></text><text x="95" y="799.5" text-anchor="middle" font-family="Arial" font-size="15" fill="#254334" font-weight="bold"><tspan x="95" dy="0">«Primary Actor»</tspan><tspan x="95" dy="18">ADMIN</tspan></text><text x="784.5" y="181.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[oversight selected]</tspan></text><text x="784.5" y="240.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[history selected]</tspan></text><text x="784.5" y="332.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[eligible target]</tspan></text><text x="784.5" y="391.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[recipient selected]</tspan></text><text x="784.5" y="483.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; no self-review]</tspan></text><text x="784.5" y="634.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[authorized action]</tspan></text><text x="784.5" y="693.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[settings selected]</tspan></text><text x="784.5" y="785.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[open reports]</tspan></text><text x="784.5" y="844.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[AI configured]</tspan></text><text x="784.5" y="936.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; impartial]</tspan></text><text x="784.5" y="995.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; more info needed]</tspan></text><text x="784.5" y="1087.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[pending; impartial]</tspan></text><text x="784.5" y="1146.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[no outstanding request]</tspan></text><text x="784.5" y="1238.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[worker configured]</tspan></text><text x="784.5" y="1297.6" text-anchor="middle" font-family="Arial" font-size="12" fill="#7F618C" ><tspan x="784.5" dy="0">«extend»</tspan><tspan x="784.5" dy="14.399999999999999">[selection valid]</tspan></text><text x="1450" y="969.5" text-anchor="middle" font-family="Arial" font-size="15" fill="#254334" font-weight="bold"><tspan x="1450" dy="0">«Supporting Actor»</tspan><tspan x="1450" dy="18">Gemini AI service</tspan></text><text x="1450" y="1343.5" text-anchor="middle" font-family="Arial" font-size="15" fill="#254334" font-weight="bold"><tspan x="1450" dy="0">«Supporting Actor»</tspan><tspan x="1450" dy="18">Collection worker</tspan></text><text x="35" y="1499.7" text-anchor="start" font-family="Arial" font-size="13" fill="#254334" ><tspan x="35" dy="0">Dashed arrows: optional actions extend inspection at the stated condition. Solid lines: actor participation, not execution order.</tspan></text><text x="35" y="1528.7" text-anchor="start" font-family="Arial" font-size="13" fill="#254334" ><tspan x="35" dy="0">Property verification: oversight only. No Staff inheritance, manual assignment API or personnel-account creation is implied.</tspan></text><text x="35" y="1557.8" text-anchor="start" font-family="Arial" font-size="12" fill="#254334" ><tspan x="35" dy="0">Scope: role-specific operations plus shared account access. Prototype assistance and accommodation-review moderation are excluded. Source: 25 November 2026.</tspan></text></svg>