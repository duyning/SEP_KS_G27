<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1444" viewBox="0 0 1400 1444"><defs><marker id="arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#374151"/></marker><marker id="reply" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#374151"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="30" y="872" width="1340" height="210" fill="none" stroke="#64748b"/><path d="M85 185 V1369" stroke="#889199" stroke-dasharray="5 5"/><circle cx="85" cy="112" r="8" fill="white" stroke="#69757c"/><path d="M85 120 v22 m-16 -14 h32 m-16 14 l-14 18 m14 -18 l14 18" fill="none" stroke="#69757c"/><text x="85" y="181" font-family="Arial" font-size="12" text-anchor="middle" fill="#17212b"><tspan x="85" dy="0">SERVICE PROVIDER</tspan></text><path d="M320 185 V1369" stroke="#889199" stroke-dasharray="5 5"/><rect x="188" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="320" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="320" dy="0">ComplaintDetail</tspan><tspan x="320" dy="17">«UI»</tspan></text><path d="M610 185 V1369" stroke="#889199" stroke-dasharray="5 5"/><rect x="478" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="610" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="610" dy="0">ServiceComplaintController</tspan><tspan x="610" dy="17">«Controller»</tspan></text><path d="M900 185 V1369" stroke="#889199" stroke-dasharray="5 5"/><rect x="768" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="900" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="900" dy="0">ServiceComplaintService</tspan><tspan x="900" dy="17">«Service»</tspan></text><path d="M1200 185 V1369" stroke="#889199" stroke-dasharray="5 5"/><rect x="1068" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="1200" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1200" dy="0">Repositories / JPA</tspan><tspan x="1200" dy="17">Complaint / Event / Audit</tspan><tspan x="1200" dy="17">«Persistence facade»</tspan></text><text x="30" y="51" font-family="Arial" font-size="28" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Respond to Staff Request</tspan></text><text x="30" y="84" font-family="Arial" font-size="16" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Sequence Diagram — Respond to Staff Request</tspan></text><line x1="85" y1="244" x2="320" y2="244" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="234" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">1: open received staff request(id)</tspan></text><line x1="320" y1="298" x2="610" y2="298" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="288" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">2: detail(id)</tspan></text><line x1="610" y1="352" x2="900" y2="352" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="342" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">3: detail(id): authorize access</tspan></text><line x1="900" y1="406" x2="1200" y2="406" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="396" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">4: load complaint, staff request and history</tspan></text><line x1="900" y1="460" x2="610" y2="460" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="450" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">5: return Detail + canExplain</tspan></text><line x1="610" y1="514" x2="320" y2="514" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="504" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">6: return Detail</tspan></text><line x1="320" y1="568" x2="85" y2="568" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="558" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">7: display staff instructions</tspan></text><line x1="85" y1="622" x2="320" y2="622" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="612" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">8: enter response and evidence; submit</tspan></text><line x1="320" y1="676" x2="610" y2="676" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="666" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">9: explain(id, Explanation, images)</tspan></text><line x1="610" y1="730" x2="900" y2="730" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="720" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">10: explain(id, revision, content, images)</tspan></text><line x1="900" y1="784" x2="1200" y2="784" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="774" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">11: findForReview(id): lock complaint</tspan></text><path d="M900 826 h85 v24 h-85" fill="none" stroke="#374151" marker-end="url(#arrow)"/><text x="995" y="824" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="995" dy="0">12: verify owner, revision, open status</tspan><tspan x="995" dy="17">and pending request; validate evidence</tspan></text><text x="52" y="890" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="52" dy="0">break</tspan></text><text x="90" y="890" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">[Request rejected — 400 / 404 / 409]</tspan></text><line x1="900" y1="956" x2="610" y2="956" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="946" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">13: throw AppException / validation error</tspan></text><line x1="610" y1="1010" x2="320" y2="1010" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="1000" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">14: error response via exception handler</tspan></text><line x1="320" y1="1064" x2="85" y2="1064" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="1037" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">15: show error; retain input;</tspan><tspan x="202.5" dy="17">no successful write</tspan></text><line x1="900" y1="1152" x2="1200" y2="1152" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1108" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">16: keep PENDING; clear responseRequested;</tspan><tspan x="1050" dy="17">save EXPLAINED event + images + audit;</tspan><tspan x="1050" dy="17">increment complaint revision</tspan></text><line x1="900" y1="1206" x2="610" y2="1206" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="1196" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">17: return updated Detail; commit</tspan></text><line x1="610" y1="1260" x2="320" y2="1260" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="1250" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">18: 200 OK + ApiResponse&lt;Detail&gt;</tspan></text><line x1="320" y1="1314" x2="85" y2="1314" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="1304" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">19: display response confirmation</tspan></text><text x="30" y="1414" font-family="Arial" font-size="13" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">The provider sends the response to staff. The report remains PENDING. A response is optional; no automatic removal follows silence. Invalid images roll back the transaction.</tspan></text></svg>