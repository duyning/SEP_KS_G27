<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1240"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="white" stroke="#475569"/></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0 5 L7 0 L14 5 L7 10Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="860,163.48000000000002 1010,166.72" fill="none" stroke="#475569"  marker-end="url(#arrow)"/><polyline points="1010,577.96 950,578 950,907 860,906.7" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="40" y="50" font-family="Arial" font-size="28" font-weight="bold" fill="#182b39"><tspan x="40" dy="0">Class Diagram — Controller &amp; Service</tspan></text><rect x="40" y="125" width="820" height="296" fill="white" stroke="#547782"/><rect x="40" y="125" width="820" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="147" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«RestController»</tspan></text><text x="52" y="170" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">ServiceComplaintController</tspan></text><text x="52" y="207" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">- service: ServiceComplaintService {readOnly}</tspan></text><path d="M40 223 h820" stroke="#547782"/><text x="52" y="245" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">+ mine(): ApiResponse&lt;?&gt;</tspan><tspan x="52" dy="20">+ incoming(): ApiResponse&lt;?&gt;</tspan><tspan x="52" dy="20">+ list(): ApiResponse&lt;?&gt;</tspan><tspan x="52" dy="20">+ detail(id: Integer): ApiResponse&lt;?&gt;</tspan><tspan x="52" dy="20">+ submit(input: Input, images: List&lt;MultipartFile&gt;): ResponseEntity&lt;?&gt; {throws IOException}</tspan><tspan x="52" dy="20">+ explain(id: Integer, input: Explanation, images: List&lt;MultipartFile&gt;): ApiResponse&lt;?&gt; {throws IOException}</tspan><tspan x="52" dy="20">+ review(id: Integer, input: Decision): ApiResponse&lt;?&gt;</tspan><tspan x="52" dy="20">+ image(id: Integer, index: int): ResponseEntity&lt;byte[]&gt;</tspan><tspan x="52" dy="20">+ eventImage(id: Integer, eventId: Integer, index: int): ResponseEntity&lt;byte[]&gt;</tspan></text><rect x="1010" y="125" width="850" height="596" fill="white" stroke="#547782"/><rect x="1010" y="125" width="850" height="60" fill="#b1dfe7" stroke="#547782"/><text x="1022" y="147" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1022" dy="0">«Service» transactional</tspan></text><text x="1022" y="170" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="1022" dy="0">ServiceComplaintService</tspan></text><text x="1022" y="207" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1022" dy="0">- OPEN: List&lt;String&gt; {static} {readOnly}</tspan><tspan x="1022" dy="20">- auth: AuthService {readOnly}</tspan><tspan x="1022" dy="20">- complaints: ServiceComplaintRepository {readOnly}</tspan><tspan x="1022" dy="20">- events: ServiceComplaintEventRepository {readOnly}</tspan><tspan x="1022" dy="20">- services: ServiceRepository {readOnly}</tspan><tspan x="1022" dy="20">- users: UserRepository {readOnly}</tspan><tspan x="1022" dy="20">- logs: ModerationLogRepository {readOnly}</tspan><tspan x="1022" dy="20">- publication: ServicePublicationService {readOnly}</tspan><tspan x="1022" dy="20">- entityManager: jakarta.persistence.EntityManager {readOnly}</tspan></text><path d="M1010 383 h850" stroke="#547782"/><text x="1022" y="405" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1022" dy="0">- missing(): AppException</tspan><tspan x="1022" dy="20">- staff(actor: User): boolean</tspan><tspan x="1022" dy="20">- requireStaff(): void</tspan><tspan x="1022" dy="20">- owner(c: ServiceComplaint, actor: User): boolean</tspan><tspan x="1022" dy="20">- impartial(c: ServiceComplaint, actor: User): boolean</tspan><tspan x="1022" dy="20">- accessible(id: Integer): ServiceComplaint</tspan><tspan x="1022" dy="20">- summary(c: ServiceComplaint): Summary</tspan><tspan x="1022" dy="20">- urls(base: String, count: int): List&lt;String&gt;</tspan><tspan x="1022" dy="20">+ list(scope: String): List&lt;Summary&gt;</tspan><tspan x="1022" dy="20">+ detail(id: Integer): Detail</tspan><tspan x="1022" dy="20">+ submit(serviceId: Integer, content: String, images: List&lt;MultipartFile&gt;): Detail {throws IOException}</tspan><tspan x="1022" dy="20">- fresh(c: ServiceComplaint, revision: int): void</tspan><tspan x="1022" dy="20">- event(c: ServiceComplaint, action: String, content: String, images: List&lt;ServiceImage&gt;): void</tspan><tspan x="1022" dy="20">+ explain(id: Integer, revision: int, content: String, images: List&lt;MultipartFile&gt;): Detail {throws IOException}</tspan><tspan x="1022" dy="20">+ review(id: Integer, revision: int, action: String, content: String): Detail</tspan><tspan x="1022" dy="20">+ image(id: Integer, eventId: Integer, index: int): StaffService.FileContent</tspan></text><text x="870" y="150.48000000000002" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="870" dy="0"></tspan></text><text x="925" y="153.72" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="925" dy="0">1  service</tspan></text><rect x="40" y="850" width="820" height="162" fill="white" stroke="#547782"/><rect x="40" y="850" width="820" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="872" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«Utility» final class</tspan></text><text x="52" y="895" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">ServiceFeedbackImages</tspan></text><text x="52" y="932" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0"></tspan></text><path d="M40 934 h820" stroke="#547782"/><text x="52" y="956" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">- ServiceFeedbackImages()</tspan><tspan x="52" dy="20">+ read(files: List&lt;MultipartFile&gt;): List&lt;ServiceImage&gt; {static; throws IOException}</tspan><tspan x="52" dy="20">+ text(value: String, min: int): String {static}</tspan></text><text x="650" y="813" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="650" dy="0">validates content and images</tspan></text><text x="40" y="1103" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="40" dy="0">Scope: all declared fields and operations of the complaint controller/service; constructors and Lombok-generated members omitted.</tspan><tspan x="40" dy="20">Input, Explanation and Decision are nested controller records; Summary, Event and Detail are nested service records (DTO page).</tspan><tspan x="40" dy="20">AuthService, ServicePublicationService, EntityManager and the three shared repositories are external collaborators named in the attributes.</tspan><tspan x="40" dy="20">No inheritance or ownership is implied by an injected reference. FileContent is StaffService.FileContent (DTO page).</tspan></text></svg>