pecialization</tspan></text><text x="982" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="982" dy="0">JpaRepository&lt;ServiceComplaintEvent, Integer&gt;</tspan></text><text x="982" y="202" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="982" dy="0"></tspan></text><rect x="40" y="370" width="850" height="222" fill="white" stroke="#547782"/><rect x="40" y="370" width="850" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="392" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«Interface»</tspan></text><text x="52" y="415" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">ServiceComplaintRepository</tspan></text><text x="52" y="452" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0"></tspan></text><path d="M40 454 h850" stroke="#547782"/><text x="52" y="476" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">+ findAllByOrderByComplaintIdDesc(): List&lt;ServiceComplaint&gt;</tspan><tspan x="52" dy="20">+ findByService_Provider_UserIdOrderByComplaintIdDesc(id: Integer): List&lt;ServiceComplaint&gt;</tspan><tspan x="52" dy="20">+ findByReporter_UserIdOrderByComplaintIdDesc(id: Integer): List&lt;ServiceComplaint&gt;</tspan><tspan x="52" dy="20">+ existsByService_ServiceIdAndReporter_UserIdAndStatusIn(serviceId: Integer, reporterId: Integer,</tspan><tspan x="52" dy="20">    statuses: List&lt;String&gt;): boolean</tspan><tspan x="52" dy="20">+ findForReview(id: Integer): Optional&lt;ServiceComplaint&gt;</tspan></text><rect x="970" y="370" width="850" height="122" fill="white" stroke="#547782"/><rect x="970" y="370" width="850" height="60" fill="#b1dfe7" stroke="#547782"/><text x="982" y="392" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="982" dy="0">«Interface»</tspan></text><text x="982" y="415" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="982" dy="0">ServiceComplaintEventRepository</tspan></text><text x="982" y="452" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="982" dy="0"></tspan></text><path d="M970 454 h850" stroke="#547782"/><text x="982" y="476" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="982" dy="0">+ findByComplaint_ComplaintIdOrderByEventIdAsc(id: Integer): List&lt;ServiceComplaintEvent&gt;</tspan></text><rect x="40" y="960" width="850" height="84" fill="white" stroke="#547782"/><rect x="40" y="960" width="850" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="982" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«Entity reference — see entity page»</tspan></text><text x="52" y="1005" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">ServiceComplaint</tspan></text><text x="52" y="1042" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0"></tspan></text><rect x="970" y="960" width="850" height="84" fill="white" stroke="#547782"/><rect x="970" y="960" width="850" height="60" fill="#b1dfe7" stroke="#547782"/><text x="982" y="982" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="982" dy="0">«Entity reference — see entity page»</tspan></text><text x="982" y="1005" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="982" dy="0">ServiceComplaintEvent</tspan></text><text x="982" y="1042" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="982" dy="0"></tspan></text><text x="40" y="1153" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="40" dy="0">Solid line + hollow triangle: interface generalization (extends). Dashed arrow: dependency on the managed entity type.</tspan><tspan x="40" dy="20">Inherited JpaRepository operations are not redeclared. findForReview(id) uses PESSIMISTIC_WRITE.</tspan><tspan x="40" dy="20">ServiceRepository, UserRepository and ModerationLogRepository are shared repositories; only their references are in scope.</tspan></text></svg>