<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1810" viewBox="0 0 1400 1810"><defs><marker id="arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#374151"/></marker><marker id="reply" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#374151"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="30" y="872" width="1340" height="210" fill="none" stroke="#64748b"/><rect x="30" y="1158" width="1340" height="306" fill="none" stroke="#64748b"/><path d="M85 185 V1735" stroke="#889199" stroke-dasharray="5 5"/><circle cx="85" cy="112" r="8" fill="white" stroke="#69757c"/><path d="M85 120 v22 m-16 -14 h32 m-16 14 l-14 18 m14 -18 l14 18" fill="none" stroke="#69757c"/><text x="85" y="181" font-family="Arial" font-size="12" text-anchor="middle" fill="#17212b"><tspan x="85" dy="0">STAFF / ADMIN</tspan></text><path d="M320 185 V1735" stroke="#889199" stroke-dasharray="5 5"/><rect x="188" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="320" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="320" dy="0">ComplaintDetail</tspan><tspan x="320" dy="17">«UI»</tspan></text><path d="M610 185 V1735" stroke="#889199" stroke-dasharray="5 5"/><rect x="478" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="610" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="610" dy="0">ServiceComplaintController</tspan><tspan x="610" dy="17">«Controller»</tspan></text><path d="M900 185 V1735" stroke="#889199" stroke-dasharray="5 5"/><rect x="768" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="900" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="900" dy="0">ServiceComplaintService</tspan><tspan x="900" dy="17">«Service»</tspan></text><path d="M1200 185 V1735" stroke="#889199" stroke-dasharray="5 5"/><rect x="1068" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="1200" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1200" dy="0">Repositories / JPA</tspan><tspan x="1200" dy="17">Complaint / Service / Audit</tspan><tspan x="1200" dy="17">«Persistence facade»</tspan></text><text x="30" y="51" font-family="Arial" font-size="28" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Review Service Complaint</tspan></text><text x="30" y="84" font-family="Arial" font-size="16" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Sequence Diagram — Review Service Complaint</tspan></text><line x1="85" y1="244" x2="320" y2="244" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="234" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">1: openComplaint(id)</tspan></text><line x1="320" y1="298" x2="610" y2="298" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="288" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">2: detail(id)</tspan></text><line x1="610" y1="352" x2="900" y2="352" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="342" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">3: detail(id): authorize access</tspan></text><line x1="900" y1="406" x2="1200" y2="406" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="396" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">4: load complaint, evidence and history</tspan></text><line x1="900" y1="460" x2="610" y2="460" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="450" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">5: return Detail + permissions</tspan></text><line x1="610" y1="514" x2="320" y2="514" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="504" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">6: return Detail</tspan></text><line x1="320" y1="568" x2="85" y2="568" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="558" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">7: display complaint and available actions</tspan></text><line x1="85" y1="622" x2="320" y2="622" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="595" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">8: choose action; enter reason;</tspan><tspan x="202.5" dy="17">confirm removal if selected</tspan></text><line x1="320" y1="676" x2="610" y2="676" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="666" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">9: review(id, Decision)</tspan></text><line x1="610" y1="730" x2="900" y2="730" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="720" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">10: review(id, revision, action, content)</tspan></text><line x1="900" y1="784" x2="1200" y2="784" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="774" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">11: findForReview(id): lock complaint</tspan></text><path d="M900 826 h85 v24 h-85" fill="none" stroke="#374151" marker-end="url(#arrow)"/><text x="995" y="824" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="995" dy="0">12: check staff, impartiality, revision,</tspan><tspan x="995" dy="17">open status, action and reason</tspan></text><text x="52" y="890" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="52" dy="0">break</tspan></text><text x="90" y="890" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">[Request rejected — 400 / 403 / 404 / 409]</tspan></text><line x1="900" y1="956" x2="610" y2="956" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="946" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">13: throw AppException / validation error</tspan></text><line x1="610" y1="1010" x2="320" y2="1010" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="1000" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">14: error response via exception handler</tspan></text><line x1="320" y1="1064" x2="85" y2="1064" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="1037" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">15: show error; retain input;</tspan><tspan x="202.5" dy="17">no successful write</tspan></text><line x1="900" y1="1136" x2="1200" y2="1136" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1126" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">16: lock provider; refresh service</tspan></text><text x="52" y="1176" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="52" dy="0">alt</tspan></text><text x="90" y="1176" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">[REQUEST_EXPLANATION — no outstanding response request]</tspan></text><line x1="900" y1="1242" x2="1200" y2="1242" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1232" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">17: keep PENDING; responseRequested = true</tspan></text><path d="M30 1254 H1370" stroke="#64748b" stroke-dasharray="5 4"/><text x="90" y="1277" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">[DISMISS — finish without changing publication state]</tspan></text><line x1="900" y1="1344" x2="1200" y2="1344" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1317" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">18: set RESOLVED + outcome DISMISS;</tspan><tspan x="1050" dy="17">responseRequested = false</tspan></text><path d="M30 1356 H1370" stroke="#64748b" stroke-dasharray="5 4"/><text x="90" y="1379" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">[REMOVE — remove the service from public access]</tspan></text><line x1="900" y1="1446" x2="1200" y2="1446" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1419" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">19: set RESOLVED + outcome REMOVE;</tspan><tspan x="1050" dy="17">clear request; hide service; increment service revision</tspan></text><line x1="900" y1="1518" x2="1200" y2="1518" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="1491" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">20: save event + ModerationLog;</tspan><tspan x="1050" dy="17">increment complaint revision; flush</tspan></text><line x1="900" y1="1572" x2="610" y2="1572" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="1562" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">21: return updated Detail; commit</tspan></text><line x1="610" y1="1626" x2="320" y2="1626" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="1616" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">22: 200 OK + ApiResponse&lt;Detail&gt;</tspan></text><line x1="320" y1="1680" x2="85" y2="1680" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="1670" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">23: display request confirmation or outcome</tspan></text><text x="30" y="1780" font-family="Arial" font-size="13" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">All active STAFF/ADMIN can review, excluding owner/reporter. Final decisions are immutable; errors roll back. Authentication/access checks also apply when opening a report.</tspan></text></svg>