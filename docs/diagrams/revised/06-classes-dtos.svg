<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1420"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569"/></marker><marker id="triangle" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="white" stroke="#475569"/></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0 5 L7 0 L14 5 L7 10Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="675,598.8 590,629" fill="none" stroke="#475569"  marker-end="url(#arrow)"/><polyline points="1225,598.8 1310,579" fill="none" stroke="#475569"  marker-end="url(#arrow)"/><text x="40" y="50" font-family="Arial" font-size="28" font-weight="bold" fill="#182b39"><tspan x="40" dy="0">Class Diagram — Request &amp; Response DTOs</tspan></text><rect x="40" y="120" width="550" height="118" fill="white" stroke="#547782"/><rect x="40" y="120" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="142" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«Record»</tspan></text><text x="52" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">ServiceComplaintController.Input</tspan></text><text x="52" y="202" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">- serviceId: Integer {readOnly}</tspan><tspan x="52" dy="20">- content: String {readOnly}</tspan></text><rect x="675" y="120" width="550" height="118" fill="white" stroke="#547782"/><rect x="675" y="120" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="687" y="142" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">«Record»</tspan></text><text x="687" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="687" dy="0">ServiceComplaintController.Explanation</tspan></text><text x="687" y="202" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">- revision: Integer {readOnly}</tspan><tspan x="687" dy="20">- content: String {readOnly}</tspan></text><rect x="1310" y="120" width="550" height="138" fill="white" stroke="#547782"/><rect x="1310" y="120" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="1322" y="142" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1322" dy="0">«Record»</tspan></text><text x="1322" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="1322" dy="0">ServiceComplaintController.Decision</tspan></text><text x="1322" y="202" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1322" dy="0">- revision: Integer {readOnly}</tspan><tspan x="1322" dy="20">- action: String {readOnly}</tspan><tspan x="1322" dy="20">- content: String {readOnly}</tspan></text><rect x="40" y="480" width="550" height="298" fill="white" stroke="#547782"/><rect x="40" y="480" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="502" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«Record»</tspan></text><text x="52" y="525" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">ServiceComplaintService.Summary</tspan></text><text x="52" y="562" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">- complaintId: Integer {readOnly}</tspan><tspan x="52" dy="20">- serviceId: Integer {readOnly}</tspan><tspan x="52" dy="20">- serviceName: String {readOnly}</tspan><tspan x="52" dy="20">- providerName: String {readOnly}</tspan><tspan x="52" dy="20">- content: String {readOnly}</tspan><tspan x="52" dy="20">- status: String {readOnly}</tspan><tspan x="52" dy="20">- createdAt: Instant {readOnly}</tspan><tspan x="52" dy="20">- revision: int {readOnly}</tspan><tspan x="52" dy="20">- moderationHidden: boolean {readOnly}</tspan><tspan x="52" dy="20">- outcome: String {readOnly}</tspan><tspan x="52" dy="20">- responseRequested: boolean {readOnly}</tspan></text><rect x="675" y="480" width="550" height="198" fill="white" stroke="#547782"/><rect x="675" y="480" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="687" y="502" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">«Record»</tspan></text><text x="687" y="525" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="687" dy="0">ServiceComplaintService.Detail</tspan></text><text x="687" y="562" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">- complaint: Summary {readOnly}</tspan><tspan x="687" dy="20">- reporterName: String {readOnly}</tspan><tspan x="687" dy="20">- imageUrls: List&lt;String&gt; {readOnly}</tspan><tspan x="687" dy="20">- history: List&lt;Event&gt; {readOnly}</tspan><tspan x="687" dy="20">- canReview: boolean {readOnly}</tspan><tspan x="687" dy="20">- canExplain: boolean {readOnly}</tspan></text><rect x="1310" y="480" width="550" height="198" fill="white" stroke="#547782"/><rect x="1310" y="480" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="1322" y="502" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1322" dy="0">«Record»</tspan></text><text x="1322" y="525" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="1322" dy="0">ServiceComplaintService.Event</tspan></text><text x="1322" y="562" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1322" dy="0">- eventId: Integer {readOnly}</tspan><tspan x="1322" dy="20">- actorName: String {readOnly}</tspan><tspan x="1322" dy="20">- action: String {readOnly}</tspan><tspan x="1322" dy="20">- content: String {readOnly}</tspan><tspan x="1322" dy="20">- createdAt: Instant {readOnly}</tspan><tspan x="1322" dy="20">- imageUrls: List&lt;String&gt; {readOnly}</tspan></text><text x="625" y="585.8" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="625" dy="0"></tspan></text><text x="600" y="616" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="600" dy="0">1</tspan></text><text x="1233" y="585.8" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1233" dy="0"></tspan></text><text x="1265" y="566" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1265" dy="0">0..*</tspan></text><rect x="40" y="1000" width="550" height="118" fill="white" stroke="#547782"/><rect x="40" y="1000" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="1022" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«Record»</tspan></text><text x="52" y="1045" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">StaffService.FileContent</tspan></text><text x="52" y="1082" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">- bytes: byte[] {readOnly}</tspan><tspan x="52" dy="20">- contentType: String {readOnly}</tspan></text><rect x="675" y="1000" width="1185" height="236" fill="white" stroke="#547782"/><rect x="675" y="1000" width="1185" height="60" fill="#b1dfe7" stroke="#547782"/><text x="687" y="1022" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">«Generic response envelope»</tspan></text><text x="687" y="1045" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="687" dy="0">ApiResponse&lt;T&gt;</tspan></text><text x="687" y="1082" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">- success: boolean</tspan><tspan x="687" dy="20">- message: String</tspan><tspan x="687" dy="20">- data: T</tspan><tspan x="687" dy="20">- timestamp: LocalDateTime</tspan></text><path d="M675 1158 h1185" stroke="#547782"/><text x="687" y="1180" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">+ success&lt;T&gt;(data: T): ApiResponse&lt;T&gt; {static}</tspan><tspan x="687" dy="20">+ success&lt;T&gt;(message: String, data: T): ApiResponse&lt;T&gt; {static}</tspan><tspan x="687" dy="20">+ error&lt;T&gt;(message: String): ApiResponse&lt;T&gt; {static}</tspan></text><text x="40" y="1313" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="40" dy="0">Records are immutable Java records; component accessors, canonical constructors, equals/hashCode/toString are generated and omitted.</tspan><tspan x="40" dy="20">Input: serviceId ≥ 1; content 10–3000 characters. Explanation/Decision: revision ≥ 0; content 10–3000 characters.</tspan><tspan x="40" dy="20">Decision.action is a String restricted to REQUEST_EXPLANATION | DISMISS | REMOVE, not a Java enum.</tspan><tspan x="40" dy="20">DTO associations represent references, not JPA relationships; string image URLs are not entity associations.</tspan></text></svg>