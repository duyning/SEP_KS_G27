<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1290" viewBox="0 0 1400 1290"><defs><marker id="arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#374151"/></marker><marker id="reply" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#374151"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="30" y="668" width="1340" height="210" fill="none" stroke="#64748b"/><path d="M85 185 V1215" stroke="#889199" stroke-dasharray="5 5"/><circle cx="85" cy="112" r="8" fill="white" stroke="#69757c"/><path d="M85 120 v22 m-16 -14 h32 m-16 14 l-14 18 m14 -18 l14 18" fill="none" stroke="#69757c"/><text x="85" y="181" font-family="Arial" font-size="12" text-anchor="middle" fill="#17212b"><tspan x="85" dy="0">USER</tspan></text><path d="M320 185 V1215" stroke="#889199" stroke-dasharray="5 5"/><rect x="188" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="320" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="320" dy="0">ServiceReportForm</tspan><tspan x="320" dy="17">«UI»</tspan></text><path d="M610 185 V1215" stroke="#889199" stroke-dasharray="5 5"/><rect x="478" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="610" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="610" dy="0">ServiceComplaintController</tspan><tspan x="610" dy="17">«Controller»</tspan></text><path d="M900 185 V1215" stroke="#889199" stroke-dasharray="5 5"/><rect x="768" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="900" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="900" dy="0">ServiceComplaintService</tspan><tspan x="900" dy="17">«Service»</tspan></text><path d="M1200 185 V1215" stroke="#889199" stroke-dasharray="5 5"/><rect x="1068" y="106" width="264" height="75" fill="#a9dde7" stroke="#64858c"/><text x="1200" y="133" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1200" dy="0">Repositories / JPA</tspan><tspan x="1200" dy="17">Service / Complaint</tspan><tspan x="1200" dy="17">«Persistence facade»</tspan></text><text x="30" y="51" font-family="Arial" font-size="28" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Submit Service Complaint</tspan></text><text x="30" y="84" font-family="Arial" font-size="16" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Sequence Diagram — Submit Service Complaint</tspan></text><line x1="85" y1="244" x2="320" y2="244" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="234" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">1: open form; enter content and evidence</tspan></text><path d="M320 286 h85 v24 h-85" fill="none" stroke="#374151" marker-end="url(#arrow)"/><text x="415" y="284" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="415" dy="0">2: validate input; prevent double submit</tspan></text><line x1="85" y1="364" x2="320" y2="364" stroke="#374151"  marker-end="url(#arrow)"/><text x="202.5" y="354" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">3: submitReport()</tspan></text><line x1="320" y1="418" x2="610" y2="418" stroke="#374151"  marker-end="url(#arrow)"/><text x="465" y="408" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">4: submit(Input, List&lt;MultipartFile&gt;)</tspan></text><line x1="610" y1="472" x2="900" y2="472" stroke="#374151"  marker-end="url(#arrow)"/><text x="755" y="462" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">5: submit(serviceId, content, images)</tspan></text><line x1="900" y1="526" x2="1200" y2="526" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="499" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">6: load service; lock provider;</tspan><tspan x="1050" dy="17">refresh service</tspan></text><line x1="1200" y1="580" x2="900" y2="580" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="1050" y="570" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">7: return current service</tspan></text><path d="M900 622 h85 v24 h-85" fill="none" stroke="#374151" marker-end="url(#arrow)"/><text x="995" y="620" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="995" dy="0">8: check public eligibility, ownership,</tspan><tspan x="995" dy="17">duplicate open report; validate evidence</tspan></text><text x="52" y="686" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="52" dy="0">break</tspan></text><text x="90" y="686" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="90" dy="0">[Request rejected — 400 / 403 / 404 / 409]</tspan></text><line x1="900" y1="752" x2="610" y2="752" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="742" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">9: throw AppException / validation error</tspan></text><line x1="610" y1="806" x2="320" y2="806" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="796" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">10: error response via exception handler</tspan></text><line x1="320" y1="860" x2="85" y2="860" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="833" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">11: show error; retain input;</tspan><tspan x="202.5" dy="17">no successful write</tspan></text><line x1="900" y1="932" x2="1200" y2="932" stroke="#374151"  marker-end="url(#arrow)"/><text x="1050" y="905" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="1050" dy="0">12: saveAndFlush complaint(PENDING)</tspan><tspan x="1050" dy="17">with reporter, timestamp and images</tspan></text><path d="M900 974 h85 v24 h-85" fill="none" stroke="#374151" marker-end="url(#arrow)"/><text x="995" y="972" font-family="Arial" font-size="14" text-anchor="start" fill="#17212b"><tspan x="995" dy="0">13: detail(id): build authorized response</tspan></text><line x1="900" y1="1052" x2="610" y2="1052" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="755" y="1042" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="755" dy="0">14: return Detail; transaction commits</tspan></text><line x1="610" y1="1106" x2="320" y2="1106" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="465" y="1096" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="465" dy="0">15: 201 Created + ApiResponse&lt;Detail&gt;</tspan></text><line x1="320" y1="1160" x2="85" y2="1160" stroke="#374151" stroke-dasharray="5 4" marker-end="url(#reply)"/><text x="202.5" y="1150" font-family="Arial" font-size="14" text-anchor="middle" fill="#17212b"><tspan x="202.5" dy="0">16: display receipt and tracking link</tspan></text><text x="30" y="1260" font-family="Arial" font-size="13" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Precondition: authenticated user. Security may return 401 before the controller. Text: 10–3000 characters; ≤5 JPG/PNG/WEBP images, ≤5 MB each.</tspan></text></svg>