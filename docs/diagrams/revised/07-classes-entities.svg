"14"  fill="#182b39"><tspan x="1322" dy="0">«Entity» relevant members only</tspan></text><text x="1322" y="205" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="1322" dy="0">User</tspan></text><text x="1322" y="242" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1322" dy="0">- userId: Integer</tspan><tspan x="1322" dy="20">- fullName: String</tspan><tspan x="1322" dy="20">- role: UserRole</tspan><tspan x="1322" dy="20">- status: UserStatus</tspan></text><rect x="40" y="880" width="550" height="198" fill="white" stroke="#547782"/><rect x="40" y="880" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="52" y="902" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">«Entity» relevant members only</tspan></text><text x="52" y="925" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="52" dy="0">Service</tspan></text><text x="52" y="962" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="52" dy="0">- serviceId: Integer</tspan><tspan x="52" dy="20">- provider: User</tspan><tspan x="52" dy="20">- serviceName: String</tspan><tspan x="52" dy="20">- status: String</tspan><tspan x="52" dy="20">- moderationHidden: boolean</tspan><tspan x="52" dy="20">- revision: int</tspan></text><rect x="675" y="880" width="550" height="118" fill="white" stroke="#547782"/><rect x="675" y="880" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="687" y="902" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">«Embeddable» all fields</tspan></text><text x="687" y="925" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="687" dy="0">ServiceImage</tspan></text><text x="687" y="962" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="687" dy="0">- content: byte[]</tspan><tspan x="687" dy="20">- contentType: String</tspan></text><rect x="1310" y="880" width="550" height="218" fill="white" stroke="#547782"/><rect x="1310" y="880" width="550" height="60" fill="#b1dfe7" stroke="#547782"/><text x="1322" y="902" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1322" dy="0">«Entity» all fields</tspan></text><text x="1322" y="925" font-family="Arial" font-size="16" font-weight="bold" fill="#182b39"><tspan x="1322" dy="0">ModerationLog</tspan></text><text x="1322" y="962" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1322" dy="0">- logId: Integer</tspan><tspan x="1322" dy="20">- staff: User</tspan><tspan x="1322" dy="20">- targetType: String</tspan><tspan x="1322" dy="20">- targetId: Integer</tspan><tspan x="1322" dy="20">- action: String</tspan><tspan x="1322" dy="20">- note: String</tspan><tspan x="1322" dy="20">- createdAt: LocalDateTime</tspan></text><text x="630" y="232.2" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="630" dy="0">0..*</tspan></text><text x="598" y="251.8" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="598" dy="0">1</tspan></text><text x="594" y="218" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="594" dy="0">complaint</tspan></text><text x="1233" y="234.2" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1233" dy="0">0..*</tspan></text><text x="1275" y="210.2" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1275" dy="0">1</tspan></text><text x="1230" y="223" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="1230" dy="0">actor</tspan></text><text x="242.5" y="539" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="242.5" dy="0">0..*</tspan></text><text x="242.5" y="865" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="242.5" dy="0">1</tspan></text><text x="245" y="753" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="245" dy="0">service</tspan></text><text x="215" y="145" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="215" dy="0">0..*</tspan></text><text x="1595" y="145" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1595" dy="0">1</tspan></text><text x="760" y="99" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="760" dy="0">reporter</tspan></text><text x="600" y="985.8" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="600" dy="0">0..*</tspan></text><text x="1815" y="341" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1815" dy="0">1</tspan></text><text x="1460" y="720" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="1460" dy="0">provider</tspan></text><text x="1595" y="865" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1595" dy="0">0..*</tspan></text><text x="1595" y="341" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1595" dy="0">1</tspan></text><text x="1600" y="603" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="1600" dy="0">staff</tspan></text><text x="1015" y="403" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1015" dy="0">0..1</tspan></text><text x="1015" y="865" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="1015" dy="0">0..*</tspan></text><text x="1020" y="688" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="1020" dy="0">images</tspan></text><text x="600" y="454.71999999999997" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="600" dy="0">0..1</tspan></text><text x="795" y="865" font-family="Arial" font-size="14"  fill="#182b39"><tspan x="795" dy="0">0..*</tspan></text><text x="690" y="805" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="690" dy="0">images</tspan></text><text x="40" y="1253" font-family="Arial" font-size="13"  fill="#182b39"><tspan x="40" dy="0">Solid open arrows: navigable associations. Multiplicities belong to the two association ends. Filled diamond: owned embeddable image values.</tspan><tspan x="40" dy="20">Generated Lombok accessors/constructors are omitted. Service/User are explicitly partial; other entity fields above are complete.</tspan><tspan x="40" dy="20">ServiceComplaint.status and outcome are String fields. Current status: PENDING / RESOLVED; outcome: null / DISMISS / REMOVE.</tspan><tspan x="40" dy="20">Legacy status values remain readable. Event.action: REQUEST_EXPLANATION / EXPLAINED / DISMISS / REMOVE.</tspan><tspan x="40" dy="20">ModerationLog.targetId is a scalar polymorphic ID, not a JPA association to ServiceComplaint. No cascade-delete guarantee is implied for events.</tspan><tspan x="40" dy="20">Each image value has one owner: complaint XOR event; request validation limits each image list to five.</tspan><tspan x="40" dy="20">UserRole = USER / ROOM_HOST / STAFF / ADMIN; UserStatus = ACTIVE / INACTIVE. MANAGE_SERVICE is a capability, not a role.</tspan></text></svg>