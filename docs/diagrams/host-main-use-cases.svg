<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1132" viewBox="0 0 1600 1132"><rect width="100%" height="100%" fill="white"/><rect x="225" y="108" width="1335" height="924" rx="0" fill="#FFFFFF" stroke="#365563"/><rect x="245" y="176" width="1295" height="84" rx="0" fill="#FAFBF7" stroke="#FFFFFF"/><rect x="245" y="264" width="1295" height="84" rx="0" fill="#F3F7F7" stroke="#FFFFFF"/><rect x="245" y="352" width="1295" height="84" rx="0" fill="#FAFBF7" stroke="#FFFFFF"/><rect x="245" y="440" width="1295" height="84" rx="0" fill="#F3F7F7" stroke="#FFFFFF"/><rect x="245" y="528" width="1295" height="84" rx="0" fill="#FAFBF7" stroke="#FFFFFF"/><rect x="245" y="616" width="1295" height="84" rx="0" fill="#F3F7F7" stroke="#FFFFFF"/><rect x="245" y="704" width="1295" height="84" rx="0" fill="#FAFBF7" stroke="#FFFFFF"/><rect x="245" y="792" width="1295" height="84" rx="0" fill="#F3F7F7" stroke="#FFFFFF"/><polyline points="124,187.8 205,188 205,212 340,218" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,218" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,306" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,394" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,482" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,570" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,658" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,746" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 340,834" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 185,568 185,1020 510,1020 510,991" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 195,568 195,1024 940,1024 940,991" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="124,567.8 205,568 205,1028 1370,1028 1370,991" fill="none" stroke="#7B8D94" stroke-width="1"/><text x="36" y="54.55" font-family="Arial" font-size="30" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="36" dy="0">NestHub Host Management</tspan></text><text x="38" y="88.545" font-family="Arial" font-size="17"  fill="#263943" text-anchor="start"><tspan x="38" dy="0">Main use cases • One system boundary • Current implementation</tspan></text><text x="245" y="135.315" font-family="Arial" font-size="19" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="245" dy="0">NestHub system boundary</tspan></text><text x="340" y="164.62" font-family="Arial" font-size="12" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="340" dy="0">MAIN GOAL</tspan></text><text x="820" y="164.62" font-family="Arial" font-size="12" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">GROUPED SCOPE AND EXECUTION CONDITIONS</tspan></text><ellipse cx="540" cy="218" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="205" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H01</tspan><tspan x="540" dy="20">Register and track</tspan><tspan x="540" dy="20">property application</tspan></text><text x="820" y="197.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">Submit evidence; track review; provide requested supplements.</tspan></text><text x="820" y="225.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">USER: combined onboarding. Approval grants ROOM_HOST.</tspan><tspan x="820" dy="17.22">Existing ROOM_HOST: use the property-registration flow.</tspan></text><ellipse cx="540" cy="306" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="293" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H02</tspan><tspan x="540" dy="20">Maintain property information</tspan><tspan x="540" dy="20">and verification</tspan></text><text x="820" y="285.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">View details; submit changes and replacement evidence.</tspan></text><text x="820" y="313.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">After registration. Important changes require re-verification;</tspan><tspan x="820" dy="17.22">public access stays blocked until the required approval.</tspan></text><ellipse cx="540" cy="394" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="381" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H03</tspan><tspan x="540" dy="20">Configure room types</tspan><tspan x="540" dy="20">and individual rooms</tspan></text><text x="820" y="373.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">Create, edit or remove types/rooms; set layout, prices and amenities.</tspan></text><text x="820" y="401.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">For an owned, approved and active property.</tspan><tspan x="820" dy="17.22">Deletion remains subject to linked data and occupancy checks.</tspan></text><ellipse cx="540" cy="482" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="469" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H04</tspan><tspan x="540" dy="20">Publish rooms and</tspan><tspan x="540" dy="20">confirm availability</tspan></text><text x="820" y="461.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">Select public rooms; confirm room-type availability freshness.</tspan></text><text x="820" y="489.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">After room setup. Publication also requires public eligibility.</tspan><tspan x="820" dy="17.22">A confirmation does not itself change room occupancy.</tspan></text><ellipse cx="540" cy="570" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="557" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H05</tspan><tspan x="540" dy="20">Handle room viewing</tspan><tspan x="540" dy="20">requests</tspan></text><text x="820" y="549.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">View requests; approve individually or in a batch; reject with reason.</tspan></text><text x="820" y="577.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">For requests to the host's property. No physical room is reserved.</tspan><tspan x="820" dy="17.22">An approved viewing is NOT required before starting a tenancy.</tspan></text><ellipse cx="540" cy="658" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="645" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H06</tspan><tspan x="540" dy="20">Manage tenancies</tspan><tspan x="540" dy="20">and occupants</tspan></text><text x="820" y="637.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">Start/end a stay; manage occupants, occupancy and lease dates.</tspan></text><text x="820" y="665.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">Requires an owned room and valid tenancy data.</tspan><tspan x="820" dy="17.22">Keep previous stays and occupant history when closing a tenancy.</tspan></text><ellipse cx="540" cy="746" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="733" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H07</tspan><tspan x="540" dy="20">Manage rental contracts</tspan><tspan x="540" dy="20">and signing</tspan></text><text x="820" y="725.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">Prepare/review a contract; optionally scan; sign and share a tenant link.</tspan></text><text x="820" y="753.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">Optional for an occupied room with lease dates; retain contract history.</tspan><tspan x="820" dy="17.22">Tenant signs separately using an eligible account and valid link.</tspan></text><ellipse cx="540" cy="834" rx="200" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="540" y="821" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="540" dy="0">UC-H08</tspan><tspan x="540" dy="20">Manage utilities, bills</tspan><tspan x="540" dy="20">and payment records</tspan></text><text x="820" y="813.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="820" dy="0">Record utilities; set collection cycles; draft/issue bills; record payments.</tspan></text><text x="820" y="841.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="820" dy="0">Uses the relevant tenancy. Final readings are required when billed.</tspan><tspan x="820" dy="17.22">Rent can be billed before utilities; payments are recorded, not processed.</tspan></text><circle cx="102" cy="163" r="12" fill="white" stroke="#365563" stroke-width="2"/><path d="M102 175 v38 m-25 -25 h50 m-25 25 l-25 30 m25 -30 l25 30" fill="none" stroke="#365563" stroke-width="2"/><text x="102" y="268.32" font-family="Arial" font-size="16" font-weight="bold" fill="#263943" text-anchor="middle"><tspan x="102" dy="0">APPLICANT</tspan><tspan x="102" dy="19.68">USER</tspan></text><circle cx="102" cy="543" r="12" fill="white" stroke="#365563" stroke-width="2"/><path d="M102 555 v38 m-25 -25 h50 m-25 25 l-25 30 m25 -30 l25 30" fill="none" stroke="#365563" stroke-width="2"/><text x="102" y="648.32" font-family="Arial" font-size="16" font-weight="bold" fill="#263943" text-anchor="middle"><tspan x="102" dy="0">ROOM HOST</tspan><tspan x="102" dy="19.68">ROOM_HOST</tspan></text><text x="260" y="906.005" font-family="Arial" font-size="13" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">AVAILABLE THROUGHOUT HOST OPERATIONS</tspan></text><ellipse cx="510" cy="958" rx="170" ry="33" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="510" y="955" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="510" dy="0">UC-H09  Account and profile</tspan><tspan x="510" dy="20">Sign in/out; profile; password</tspan></text><ellipse cx="940" cy="958" rx="170" ry="33" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="940" y="955" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="940" dy="0">UC-H10  Host dashboard</tspan><tspan x="940" dy="20">Owned property and room overview</tspan></text><ellipse cx="1370" cy="958" rx="170" ry="33" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="1370" y="955" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1370" dy="0">UC-H11  Notifications</tspan><tspan x="1370" dy="20">View and mark as read</tspan></text><text x="38" y="1065.78" font-family="Arial" font-size="14"  fill="#263943" text-anchor="start"><tspan x="38" dy="0">Read 01–08 from top to bottom as a business guide; the conditions define the actual prerequisites.</tspan><tspan x="38" dy="17.22">Solid lines show actor participation, not a mandatory sequence. No include/extend arrows are used to imply execution order.</tspan></text><text x="38" y="1107.24" font-family="Arial" font-size="12"  fill="#263943" text-anchor="start"><tspan x="38" dy="0">Scope: implemented host operations. Shared member/community features and optional Service Provider capability form separate modules.</tspan><tspan x="38" dy="14.76">Support-request screens are prototypes and are excluded. Source snapshot: 25 November 2026.</tspan></text></svg>