1.8,504.4" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="1320,555 1248,569 742,569 667,544.72" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="685,669 820,640" fill="none" stroke="#44816A" stroke-dasharray="5 4" marker-end="url(#include)"/><polyline points="1320,640 1250,606 730,606 641.8,647.4" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="1320,698 1248,712 742,712 667,687.72" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="685,812 820,783" fill="none" stroke="#44816A" stroke-dasharray="5 4" marker-end="url(#include)"/><polyline points="1320,783 1250,749 730,749 641.8,790.4" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="1320,841 1248,855 742,855 667,830.72" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="685,955 820,926" fill="none" stroke="#44816A" stroke-dasharray="5 4" marker-end="url(#include)"/><polyline points="1320,926 1250,892 730,892 641.8,933.4" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="1320,984 1248,998 742,998 667,973.72" fill="none" stroke="#9D6E46" stroke-dasharray="5 4" marker-end="url(#extend)"/><polyline points="117,633.8 155,634 215,240 325,240" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 155,634 215,383 325,383" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 155,634 215,526 325,526" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 155,634 215,669 325,669" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 155,634 215,812 325,812" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 155,634 215,955 325,955" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 175,634 175,1130 505,1130 505,1118" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 188,634 188,1138 995,1138 995,1118" fill="none" stroke="#7B8D94" stroke-width="1"/><polyline points="117,633.8 201,634 201,1146 1495,1146 1495,1118" fill="none" stroke="#7B8D94" stroke-width="1"/><text x="35" y="48.665" font-family="Arial" font-size="29" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="35" dy="0">Room Host Use Case Diagram</tspan></text><text x="37" y="82.66" font-family="Arial" font-size="16"  fill="#263943" text-anchor="start"><tspan x="37" dy="0">Main goals and grouped actions • One system boundary • A4 landscape layout</tspan></text><text x="245" y="135.815" font-family="Arial" font-size="19" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="245" dy="0">NestHub System — Room Host Management</tspan></text><text x="260" y="170.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">1  Property registration and verification</tspan></text><ellipse cx="505" cy="240" rx="180" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="505" y="237" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="505" dy="0">H01  Manage property</tspan><tspan x="505" dy="20">applications and information</tspan></text><ellipse cx="995" cy="211" rx="175" ry="24" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="995" y="208" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="995" dy="0">View property and</tspan><tspan x="995" dy="20">application status</tspan></text><ellipse cx="1495" cy="211" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="208" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Submit or supplement</tspan><tspan x="1495" dy="20">property dossier</tspan></text><ellipse cx="1495" cy="269" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="266" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Propose property</tspan><tspan x="1495" dy="20">information changes</tspan></text><text x="754" y="214.005" font-family="Arial" font-size="13"  fill="#44816A" text-anchor="middle"><tspan x="754" dy="0">«include»</tspan></text><text x="1010" y="171.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [eligible application]</tspan></text><text x="1010" y="276.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [owned property]</tspan></text><text x="260" y="313.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">2  Room configuration and publication</tspan></text><ellipse cx="505" cy="383" rx="180" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="505" y="380" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="505" dy="0">H02  Manage room types</tspan><tspan x="505" dy="20">and individual rooms</tspan></text><ellipse cx="995" cy="354" rx="175" ry="24" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="995" y="361" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="995" dy="0">View room inventory</tspan></text><ellipse cx="1495" cy="354" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="351" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Configure types, rooms</tspan><tspan x="1495" dy="20">and rental terms</tspan></text><ellipse cx="1495" cy="412" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="409" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Publish rooms and</tspan><tspan x="1495" dy="20">confirm availability</tspan></text><text x="754" y="357.005" font-family="Arial" font-size="13"  fill="#44816A" text-anchor="middle"><tspan x="754" dy="0">«include»</tspan></text><text x="1010" y="314.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [configuration selected]</tspan></text><text x="1010" y="419.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [eligible rooms]</tspan></text><text x="260" y="456.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">3  Room viewing requests</tspan></text><ellipse cx="505" cy="526" rx="180" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="505" y="523" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="505" dy="0">H03  Manage viewing</tspan><tspan x="505" dy="20">requests</tspan></text><ellipse cx="995" cy="497" rx="175" ry="24" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="995" y="504" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="995" dy="0">View incoming requests</tspan></text><ellipse cx="1495" cy="497" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="494" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Approve requests</tspan><tspan x="1495" dy="20">individually or in a batch</tspan></text><ellipse cx="1495" cy="555" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="552" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Reject a request</tspan><tspan x="1495" dy="20">with a reason</tspan></text><text x="754" y="500.005" font-family="Arial" font-size="13"  fill="#44816A" text-anchor="middle"><tspan x="754" dy="0">«include»</tspan></text><text x="1010" y="457.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [pending and available]</tspan></text><text x="1010" y="562.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [pending request]</tspan></text><text x="260" y="599.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">4  Tenancies and rental contracts</tspan></text><ellipse cx="505" cy="669" rx="180" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="505" y="666" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="505" dy="0">H04  Manage tenancies</tspan><tspan x="505" dy="20">and rental contracts</tspan></text><ellipse cx="995" cy="640" rx="175" ry="24" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="995" y="637" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="995" dy="0">View tenancy profile</tspan><tspan x="995" dy="20">and history</tspan></text><ellipse cx="1495" cy="640" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="637" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Manage stays, occupants</tspan><tspan x="1495" dy="20">and occupancy</tspan></text><ellipse cx="1495" cy="698" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="695" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Prepare and sign contracts</tspan><tspan x="1495" dy="20">and share a tenant link</tspan></text><text x="754" y="643.005" font-family="Arial" font-size="13"  fill="#44816A" text-anchor="middle"><tspan x="754" dy="0">«include»</tspan></text><text x="1010" y="600.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [tenancy action selected]</tspan></text><text x="1010" y="705.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [optional; occupied room]</tspan></text><text x="260" y="742.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">5  Utilities and payment records</tspan></text><ellipse cx="505" cy="812" rx="180" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="505" y="809" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="505" dy="0">H05  Manage utilities</tspan><tspan x="505" dy="20">and room billing</tspan></text><ellipse cx="995" cy="783" rx="175" ry="24" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="995" y="780" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="995" dy="0">View utility and</tspan><tspan x="995" dy="20">billing ledgers</tspan></text><ellipse cx="1495" cy="783" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="780" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Record electricity</tspan><tspan x="1495" dy="20">and water usage</tspan></text><ellipse cx="1495" cy="841" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="838" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Set billing cycle, issue bills</tspan><tspan x="1495" dy="20">and record payments</tspan></text><text x="754" y="786.005" font-family="Arial" font-size="13"  fill="#44816A" text-anchor="middle"><tspan x="754" dy="0">«include»</tspan></text><text x="1010" y="743.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [valid tenancy period]</tspan></text><text x="1010" y="848.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [eligible bill / payment]</tspan></text><text x="260" y="885.39" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">6  Personal account</tspan></text><ellipse cx="505" cy="955" rx="180" ry="36" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="505" y="952" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="505" dy="0">H06  Manage personal</tspan><tspan x="505" dy="20">profile and credentials</tspan></text><ellipse cx="995" cy="926" rx="175" ry="24" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="995" y="933" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="995" dy="0">View personal profile</tspan></text><ellipse cx="1495" cy="926" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="923" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Update profile and</tspan><tspan x="1495" dy="20">verify phone when required</tspan></text><ellipse cx="1495" cy="984" rx="175" ry="24" fill="#FFF1D4" stroke="#B68B43" stroke-width="1.4"/><text x="1495" y="991" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">Change password</tspan></text><text x="754" y="929.005" font-family="Arial" font-size="13"  fill="#44816A" text-anchor="middle"><tspan x="754" dy="0">«include»</tspan></text><text x="1010" y="886.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [profile change selected]</tspan></text><text x="1010" y="991.005" font-family="Arial" font-size="13"  fill="#9D6E46" text-anchor="middle"><tspan x="1010" dy="0">«extend» [valid current password]</tspan></text><circle cx="95" cy="609" r="12" fill="white" stroke="#365563" stroke-width="2"/><path d="M95 621 v38 m-25 -25 h50 m-25 25 l-25 30 m25 -30 l25 30" fill="none" stroke="#365563" stroke-width="2"/><text x="95" y="714.32" font-family="Arial" font-size="16" font-weight="bold" fill="#263943" text-anchor="middle"><tspan x="95" dy="0">PRIMARY ACTOR</tspan><tspan x="95" dy="19.68">ROOM HOST</tspan></text><text x="260" y="1030.3899999999999" font-family="Arial" font-size="14" font-weight="bold" fill="#263943" text-anchor="start"><tspan x="260" dy="0">Cross-cutting use cases — available independently of the business stages</tspan></text><ellipse cx="505" cy="1085.5" rx="180" ry="32.5" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="505" y="1092.5" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="505" dy="0">H07  View host dashboard</tspan></text><ellipse cx="995" cy="1085.5" rx="175" ry="32.5" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="995" y="1092.5" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="995" dy="0">H08  Manage notifications</tspan></text><ellipse cx="1495" cy="1085.5" rx="175" ry="32.5" fill="#E7F3EE" stroke="#5B8C78" stroke-width="1.4"/><text x="1495" y="1092.5" font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle" fill="#263943"><tspan x="1495" dy="0">H09  Sign in / sign out</tspan></text><text x="35" y="1183.005" font-family="Arial" font-size="13"  fill="#263943" text-anchor="start"><tspan x="35" dy="0">UML: include points to required viewing behavior; extend points from an optional action to its management goal. Solid lines show actor participation.</tspan></text><text x="35" y="1205.005" font-family="Arial" font-size="13"  fill="#263943" text-anchor="start"><tspan x="35" dy="0">Reading order is top to bottom, not a mandatory sequence. Viewing approval and a rental contract are not prerequisites for every tenancy.</tspan></text><text x="35" y="1224.12" font-family="Arial" font-size="12"  fill="#263943" text-anchor="start"><tspan x="35" dy="0">Scope: existing ROOM_HOST and owned records. Initial USER onboarding, prototype support screens and separate Service Provider features are outside this diagram.</tspan></text></svg>